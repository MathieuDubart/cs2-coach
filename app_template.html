<title>CS2 Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: tactical app, sticky top bar (views + player), each view a full-width sheet */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d5dce3;
  --ct:#2f6fb3; --t:#c98a1a; --good:#2e8b57; --bad:#c2413a; --warn:#b7791f; --chip:#e3e8ee; --radar-bg:#0e1319;
  --smoke:#9aa7b4; --flash:#e8d44d; --molotov:#e0663a; --he:#5fb85f;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ee; --muted:#93a0ad; --line:#2b3540;
  --ct:#5b9be0; --t:#e0a63c; --good:#4cb87a; --bad:#e2665f; --warn:#d9a043; --chip:#232c36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ee; --muted:#93a0ad; --line:#2b3540;
  --ct:#5b9be0; --t:#e0a63c; --good:#4cb87a; --bad:#e2665f; --warn:#d9a043; --chip:#232c36; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:20px;font-weight:600}
p{margin:0}
ul,ol{margin:0;padding-left:20px} li{margin:4px 0}
code{font-family:var(--f-mono);font-size:12px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.note{font-size:13px;color:var(--muted);max-width:80ch}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.brand{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.02em}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{font:500 14px var(--f-body);color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:3px}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav a:focus-visible{outline:2px solid var(--ct)}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.who select{font:500 14px var(--f-body);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:5px 8px;max-width:220px}
main{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}
.view{display:grid;gap:26px}
/* shared */
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{font:500 13px var(--f-body);padding:5px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:3px;cursor:pointer}
.btns button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btns button:focus-visible{outline:2px solid var(--ct);outline-offset:2px}
.btns.side button[data-side="T"][aria-pressed="true"]{background:var(--t);border-color:var(--t);color:#1a1206}
.btns.side button[data-side="CT"][aria-pressed="true"]{background:var(--ct);border-color:var(--ct);color:#fff}
.btns.big button{font:600 17px var(--f-display);letter-spacing:.03em;padding:7px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:600 16px var(--f-display);letter-spacing:.03em;padding:6px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;cursor:pointer}
.chips button small{font:500 11px var(--f-mono);color:var(--muted);margin-left:6px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)} .chips button[aria-pressed="true"] small{color:var(--bg)}
.chips button:focus-visible{outline:2px solid var(--ct);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px 18px;display:grid;gap:10px;min-width:0}
.tbl{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;vertical-align:bottom}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.wrap{white-space:normal}
td.good,.good{color:var(--good);font-weight:600} td.bad,.bad{color:var(--bad);font-weight:600}
td.grp{font-family:var(--f-display);font-size:16px;font-weight:600;background:var(--bg)}
tr.click{cursor:pointer} tr.click:hover td{background:color-mix(in srgb,var(--ink) 4%,transparent)}
tr[aria-selected="true"] td{background:color-mix(in srgb,var(--ct) 12%,transparent)}
.res{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:10px}
.res.win{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.res.loss{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.res.draw{background:var(--chip);color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:9px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.strong{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.weak{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.empty{background:var(--panel);border:1px dashed var(--line);padding:16px;color:var(--muted)}
.finding{background:var(--panel);border:1px solid var(--line);display:grid;grid-template-columns:52px 1fr;min-width:0}
.finding .rank{font-family:var(--f-display);font-size:34px;font-weight:700;display:flex;justify-content:center;padding-top:12px;border-right:1px solid var(--line);color:var(--muted)}
.finding.high .rank{color:var(--bad)} .finding.mid .rank{color:var(--warn)}
.finding .body{padding:14px 18px;display:grid;gap:8px;min-width:0}
.fix{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:4px}
.fix h4,.lbl4{margin:0;font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--good)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:3px;background:var(--chip);color:var(--muted);margin-right:6px}
/* radar */
.radar-box{background:var(--radar-bg);border:1px solid var(--line);display:grid;min-width:0}
.radar-box>.btns{padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
svg.radar{display:block;width:100%;height:auto}
.caption{background:var(--panel);padding:8px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px}
.caption i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.zlabel{font:600 13px var(--f-display);fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px}
.zsmall{font:500 10.5px var(--f-mono);fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px}
/* pre-game board */
.pg-top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.pg-grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr) minmax(300px,420px);gap:18px;align-items:start}
@media (max-width:1180px){.pg-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pg-grid .always{grid-column:1/-1}}
@media (max-width:760px){.pg-grid{grid-template-columns:1fr}}
.always{background:var(--ink);color:var(--bg);padding:16px 18px;display:grid;gap:12px;align-content:start;border-radius:2px}
.always h3{color:var(--bg);font-size:22px;text-transform:uppercase;letter-spacing:.05em}
.always ol{padding-left:0;list-style:none;counter-reset:r;display:grid;gap:10px;margin:0}
.always li{counter-increment:r;display:grid;grid-template-columns:28px 1fr;gap:6px;margin:0}
.always li::before{content:counter(r);font:700 24px var(--f-display);color:var(--flash);line-height:1}
.always li b{font:600 18px var(--f-display);letter-spacing:.02em;display:block;line-height:1.15}
.always li span{font-size:12.5px;opacity:.75}
.always .str{border-top:1px solid color-mix(in srgb,var(--bg) 25%,transparent);padding-top:10px;font-size:12.5px;opacity:.85}
.plan{display:grid;gap:12px;align-content:start}
.rec{display:flex;gap:14px;align-items:baseline;font-family:var(--f-display);font-size:18px}
.rec b{font-size:28px}
.pl-list{list-style:none;padding:0;display:grid;gap:8px;margin:0}
.pl-list li{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);padding:8px 12px;font-size:14px;margin:0}
.pl-list li.exploit{border-left-color:var(--good)} .pl-list li.avoid{border-left-color:var(--bad)} .pl-list li.timing{border-left-color:var(--warn)} .pl-list li.coach{border-left-color:var(--ct)} .pl-list li.try{border-left-color:var(--flash)}
.lineups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.plan .lineups{grid-template-columns:1fr}
.lu{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--smoke);padding:9px 12px;display:grid;gap:5px;font-size:13.5px;cursor:pointer;min-width:0}
.lu[data-type="flash"]{border-left-color:var(--flash)} .lu[data-type="molotov"]{border-left-color:var(--molotov)} .lu[data-type="he"]{border-left-color:var(--he)}
.lu.sel{outline:2px solid var(--ink)}
.lu .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lu .ty{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lu .route{font-weight:600}
.lu .meta{color:var(--muted);font-size:12.5px}
.cmd{display:flex;gap:6px;align-items:center;min-width:0}
.cmd code{flex:1;min-width:0;font-size:11px;background:var(--bg);border:1px solid var(--line);padding:4px 6px;overflow-x:auto;white-space:nowrap}
.cmd button{font:500 12px var(--f-body);padding:4px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:3px;cursor:pointer}
/* synthese / matchs */
.head{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
.record{display:flex;gap:18px;font-family:var(--f-display);font-size:28px;font-weight:600}
.record small{display:block;font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--panel);padding:10px 14px;display:grid;gap:2px}
.stat>b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.stat>span{font-size:12px;color:var(--muted)}
.strengths{display:flex;flex-wrap:wrap;gap:8px}
.strengths span{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good);font-size:13px;padding:4px 10px;border-radius:14px}
.stage{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:920px){.stage{grid-template-columns:1fr}}
.timeline-wrap{overflow-x:auto}
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(30px,1fr);gap:3px}
.rd{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--muted);padding:4px 2px;text-align:center;font-family:var(--f-mono);font-size:11px;display:grid;gap:1px}
.rd.T{border-top-color:var(--t)} .rd.CT{border-top-color:var(--ct)}
.rd .w{color:var(--good);font-weight:600} .rd .l{color:var(--bad);font-weight:600}
/* cartes */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.cmp{display:grid;gap:5px;font-size:13px}
.cmp .row{display:grid;grid-template-columns:minmax(0,1fr) 130px 44px;gap:8px;align-items:center}
.cmp .lb{color:var(--muted)}
.meter{height:9px;background:var(--chip);border-radius:2px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--good)}
.meter.low i{background:var(--bad)} .meter.oth i{background:var(--muted);opacity:.6}
.cmp .v{font-family:var(--f-mono);text-align:right}
.tech{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.tech div{background:var(--panel);border:1px solid var(--line);padding:12px 14px;font-size:14px}
.tech b{display:block;font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.zl h4{margin:0 0 4px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.zl.ex h4{color:var(--good)} .zl.av h4{color:var(--bad)} .zl.fr h4{color:var(--muted)}
.zl ul{font-size:14px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);padding:14px 16px;display:grid;gap:4px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.pcard[aria-pressed="true"]{outline:2px solid var(--ink)}
.pcard b{font-family:var(--f-display);font-size:22px}
.search{display:flex;gap:6px;align-items:center;flex:1 1 320px;max-width:520px}
.search input{flex:1;min-width:0;font:14px var(--f-body);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:6px 10px}
.search input:focus-visible{outline:2px solid var(--ct);outline-offset:1px}
.search button{font:600 14px var(--f-body);padding:6px 12px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:3px;cursor:pointer}
.search button:disabled{opacity:.5;cursor:progress}
.jobpanel{max-width:1400px;margin:12px auto 0;padding-inline:16px}
.jobpanel .in{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ct);padding:14px 16px;display:grid;gap:10px}
.jobpanel .in.err{border-left-color:var(--bad)} .jobpanel .in.ok{border-left-color:var(--good)}
.jobpanel .row{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.jobpanel pre{margin:0;max-height:220px;overflow:auto;background:var(--radar-bg);color:#dfe6ec;font:12px/1.55 var(--f-mono);padding:10px 12px;border-radius:2px;white-space:pre-wrap}
.jobpanel .close{font:500 13px var(--f-body);background:none;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:3px 9px;cursor:pointer}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--ct);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;margin-right:6px;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.bench{display:grid;gap:4px;font-size:13px}
.bench .row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(90px,1fr) 150px;gap:10px;align-items:center}
.bench .lb{min-width:0}
.pbar{height:10px;background:var(--chip);border-radius:2px;position:relative}
.pbar i{position:absolute;inset:0 auto 0 0;border-radius:2px}
.pbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:50%}
.bench .v{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.standing{font-family:var(--f-mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);padding:6px 10px;display:grid;gap:2px}
.standing .tg{color:var(--good)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.srcs a{color:var(--ct);text-decoration:none;border:1px solid var(--line);padding:2px 8px;border-radius:12px}
.srcs a:hover{text-decoration:underline}
.drills{margin:0;padding-left:18px;font-size:14px}
.arch{display:grid;gap:14px}
.arch-h{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.arch-h .nm{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.arch-h .ic{font-size:30px}
.arch-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.arch-grid{grid-template-columns:1fr}}
.roles{display:grid;gap:4px;font-size:13px}
.roles .row{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center}
.roles .row.main{font-weight:600}
.roles .meter i{background:var(--muted)} .roles .row.main .meter i{background:var(--ct)}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.traits span{font:600 12.5px var(--f-body);padding:3px 10px;border-radius:14px;background:color-mix(in srgb,var(--ct) 16%,transparent);color:var(--ct);cursor:help}
.wbar{display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--chip)}
.wbar i{display:block;height:100%}
.wleg{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.wleg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.desc{margin:0;display:grid;gap:6px;font-size:14px}
.arch-tag{display:inline-block;font:600 12px var(--f-body);color:var(--ct);margin-left:8px}
.pros{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pro{background:var(--bg);border:1px solid var(--line);padding:10px 12px;display:grid;gap:4px;font-size:13.5px}
.pro .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pro b{font-family:var(--f-display);font-size:19px}
.pro .sim{font:600 13px var(--f-mono);color:var(--good)}
.pro a{color:var(--ct);text-decoration:none;font-size:12.5px}
.probadge{font:600 11px var(--f-mono);padding:1px 6px;border-radius:9px;background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);margin-left:6px}
.prodetail{display:grid;gap:14px}
.prodetail .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.prodetail .kv div{background:var(--panel);padding:8px 12px;display:grid;gap:2px}
.prodetail .kv b{font-family:var(--f-display);font-size:22px}
.prodetail .kv span{font-size:12px;color:var(--muted)}
.zmaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.zmaps div{background:var(--bg);border:1px solid var(--line);padding:8px 10px;font-size:13px}
.rp-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.rp-ctl input[type=range]{flex:1;min-width:160px}
.rp-ctl .rp-time{font:600 13px var(--f-mono);min-width:52px;text-align:right}
.rp-host{max-width:760px}
.rp-rounds{display:flex;flex-wrap:wrap;gap:3px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.rp-rounds button{font:500 12px var(--f-mono);min-width:30px;padding:3px 5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:3px;cursor:pointer}
.rp-rounds button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rp-rounds button.T{border-top:3px solid var(--t)} .rp-rounds button.CT{border-top:3px solid var(--ct)}
.rp-feed{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px;font-size:12.5px;max-height:140px;overflow:auto;display:grid;gap:2px}
.pname{font:600 10px var(--f-mono);fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px}
.gauge{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.gauge div{border:1px solid var(--line);padding:12px 14px;display:grid;gap:4px;background:var(--bg)}
.gauge b{font-family:var(--f-display);font-size:30px;line-height:1}
.gauge span{font-size:12.5px;color:var(--muted)}

<script>
const D=__DATA__;

function crossRadar(box,m,side,st){
  const svg=$("svg",box),img=$("image",svg),ov=$("g",svg),cap=$(".caption",box);
  const Sd=m.sides[side];img.setAttribute("href",D.radars[`${m.map}:${st.level}`]||"");
  svg.setAttribute("viewBox",(D.viewboxes[m.map]||[0,0,1024,1024]).join(" "));ov.replaceChildren();
  if(!Sd){cap.innerHTML="<span>No data for this side.</span>";return}

  const legend=[];
  if(layers.includes("zones")){Sd.zones.forEach(z=>{const meta=zm[z.key];if(!meta||meta.level!==L)return;
    const col=z.verdict==="exploit"?"var(--good)":z.verdict==="avoid"?"var(--bad)":"#8a96a3",r=6+Math.sqrt(z.presence)*4.2;
    tip(el("circle",{cx:meta.px[0],cy:meta.px[1],r,style:`fill:${col};fill-opacity:.72;stroke:#fff;stroke-width:1.5`},ov),`${z.name}: ${Math.round(z.presence)}% of your time, you ${z.k}-${z.d}, others ${z.others_win??"—"}%`);
    el("text",{x:meta.px[0],y:meta.px[1]-r-3,"text-anchor":"middle",class:"zlabel"},ov).textContent=z.name;
    el("text",{x:meta.px[0],y:meta.px[1]+4,"text-anchor":"middle",class:"zsmall"},ov).textContent=`${z.k}-${z.d}`;});
    legend.push('<span><i style="background:var(--good)"></i>play it more</span><span><i style="background:var(--bad)"></i>avoid</span><span><i style="background:#8a96a3"></i>neutral</span><span>size = your time · number = your kills-deaths</span>')}
  if(layers.includes("duels")){Sd.duels.filter(d=>d.level===L).forEach(d=>{
      el("line",{x1:d.opp_px[0],y1:d.opp_px[1],x2:d.px[0],y2:d.px[1],style:`stroke:${d.won?"var(--good)":"var(--bad)"};stroke-width:1.6;stroke-opacity:.7;${d.won?"":"stroke-dasharray:4 3"}`},ov);
      if(d.won)el("circle",{cx:d.px[0],cy:d.px[1],r:5,style:"fill:var(--good);stroke:#fff"},ov);
      else el("path",{d:`M${d.px[0]-5} ${d.px[1]-5}L${d.px[0]+5} ${d.px[1]+5}M${d.px[0]+5} ${d.px[1]-5}L${d.px[0]-5} ${d.px[1]+5}`,style:"stroke:var(--bad);stroke-width:3;stroke-linecap:round"},ov);});
    legend.push('<span><i style="background:var(--good)"></i>duel won</span><span><i style="background:var(--bad)"></i>duel lost</span>')}
  if(layers.includes("best")){Sd.best_spots.filter(b=>b.level===L).forEach(b=>{const [x,y]=b.px;
      tip(el("path",{d:`M${x} ${y-10}L${x+3} ${y-3}L${x+10} ${y-3}L${x+4} ${y+2}L${x+6} ${y+9}L${x} ${y+5}L${x-6} ${y+9}L${x-4} ${y+2}L${x-10} ${y-3}L${x-3} ${y-3}Z`,style:"fill:#ffd24a;stroke:#000;stroke-width:1"},ov),
        `${b.zone}: ${b.k} kills for ${b.d} deaths by other players, ${b.hold_pct}% holding, around ${b.t_med} s`);});
    if(Sd.best_spots.length)legend.push("<span>★ spot where other players win ≥ 65% of their duels</span>")}
  if(layers.includes("nades")){const idx=st.nades||Sd.lineups.map((_,i)=>i);
    idx.forEach(i=>{const l=Sd.lineups[i];if(!l||(l.level!==L&&l.land_level!==L))return;const col=`var(--${l.type})`,sel=st.sel===i,dim=st.sel!=null&&!sel;
      el("line",{x1:l.from_px[0],y1:l.from_px[1],x2:l.to_px[0],y2:l.to_px[1],style:`stroke:${col};stroke-width:${sel?3.5:2.2};stroke-opacity:${dim?.3:1};stroke-dasharray:6 4`},ov);
      el("circle",{cx:l.from_px[0],cy:l.from_px[1],r:sel?6:4,style:`fill:#fff;stroke:${col};stroke-width:2`},ov);
      tip(el("circle",{cx:l.to_px[0],cy:l.to_px[1],r:sel?11:8,style:`fill:${col};fill-opacity:${dim?.3:.85};stroke:#000`},ov),`${TYPE[l.type]} ${l.from_zone} → ${l.to_zone||"?"}`);});
    legend.push('<span><i style="background:var(--smoke)"></i>smoke</span><span><i style="background:var(--flash)"></i>flash</span><span><i style="background:var(--molotov)"></i>molotov</span><span><i style="background:var(--he)"></i>HE</span><span>white dot = thrower</span>')}
  cap.innerHTML=legend.join("");
}

          ${Sd.pool_zones.filter(z=>z.k+z.d>=20).map(z=>`<tr><td>${esc(z.name)}</td><td class="n ${z.win>=56?"good":z.win<=42?"bad":""}">${z.win}%</td><td class="n">${z.k+z.d}</td><td class="n">${Math.round(z.others_presence)}%</td><td class="n">${z.hold_pct==null?"—":z.hold_pct+"%"}</td><td class="n">${z.t_med} s</td><td class="n">${Math.round(z.my_presence)}%</td></tr>`).join("")}

      const GA=((p.deep||{}).grenades||{})[m.map],miss=GA?GA.missing.filter(x=>x.side===st.side):[];

      $("#zl",host).insertAdjacentHTML("beforeend",pz?`<div><h4 class="lbl4" style="color:var(--muted);margin-bottom:6px">Pros who play your zones as ${st.side}</h4>

        <div class="pros">${pz.pros.map(x=>proCard(x,"overlap")).join("")}</div></div>`:"");
      $("#lus",host).innerHTML=Sd.lineups.length?Sd.lineups.map(lineupCard).join(""):`<p class="note">Not enough grenades observed.</p>`;
      $$(".lu",host).forEach(cd=>{cd.onclick=()=>{st.sel=+cd.dataset.i;st.layers=["nades"];press(box,"[data-layer]",$('[data-layer="nades"]',box));const l=Sd.lineups[st.sel];

        $$(".lu",host).forEach(x=>x.classList.toggle("sel",x===cd));redraw();box.scrollIntoView({behavior:"smooth",block:"nearest"})};cd.onkeydown=e=>{if(e.key==="Enter")cd.click()}});
      copyBtn(host)}
    $$("[data-side]",host).forEach(b=>b.onclick=()=>{st.side=b.dataset.side;st.sel=null;press(host,"[data-side]",b);panel();redraw()});

    $$("[data-level]",box).forEach(b=>b.onclick=()=>{st.level=b.dataset.level;press(box,"[data-level]",b);redraw()});
    panel();redraw();
  }
}

// ---------- view: progress ----------
const WORKS=v=>v==="it works"||v==="ça marche",HURTS=v=>v==="it hurts"||v==="ça dégrade";
function expValue(x,unit){if(!x||x.value==null)return "—";return x.kind==="prop"?`${x.value}% (${x.k}/${x.n})`:fmtU(x.value,unit)}
function expCard(e){const pr=e.progress||[0,1,""],pct=Math.min(100,Math.round(100*pr[0]/Math.max(pr[1],1)));
  const cls=WORKS(e.verdict)?"strong":HURTS(e.verdict)?"weak":"";
  return `<article class="card exp"><div class="top"><span class="tag">${esc(e.category)}</span><span class="pill ${cls}">${e.status==="active"?"":"finished · "}${esc(e.verdict)}</span></div>
   <span class="ttl">${esc(e.title)}</span>
   <ul>${(e.how||[]).map(h=>`<li>${esc(h)}</li>`).join("")}</ul>
   <div class="prog" title="${pct}%"><i style="width:${pct}%"></i></div><span class="note">${pr[0]}/${pr[1]} ${esc(pr[2])} · started ${fmtDate(e.started)}${e.ended?` · finished ${fmtDate(e.ended)}`:""}</span>
   <div class="standing"><span>${esc(e.metric)}</span><span>before: ${expValue(e.before,e.unit)} · since: ${expValue(e.after,e.unit)}</span></div>
   ${e.status==="active"&&D.local?`<div class="btns"><button type="button" data-xstop="${e.id}">End the experiment</button></div>`:""}</article>`}
function suggestCard(s,i){return `<article class="card exp"><div class="top"><span class="tag">${esc(s.category)}</span></div><span class="ttl">${esc(s.title)}</span><p>${esc(s.why)}</p><span class="note">Measured with: ${esc(s.metric)}</span>${D.local?`<div class="btns"><button type="button" class="primary" data-xstart="${i}">Start</button></div>`:""}</article>`}
function kpiCard(k){const vals=k.series.map(x=>x[1]),W=200,H=40,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((y,i)=>`${(i/Math.max(vals.length-1,1)*W).toFixed(1)},${(H-4-(y-mn)/rg*(H-8)).toFixed(1)}`).join(" ");
  const d=k.recent-k.before,better=k.higher_better?d>0:d<0;
  return `<div class="kpi"><span class="note">${esc(k.label)}</span><b class="${Math.abs(d)<1e-9?"":better?"good":"bad"}">${fmtU(k.recent,k.unit)}</b>
   <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Trend over ${vals.length} matches"><polyline points="${pts}" fill="none" stroke="var(--ct)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
   <span class="note">last 3 ${fmtU(k.recent,k.unit)} · before ${fmtU(k.before,k.unit)} · ${vals.length} matches</span></div>`}
function weaponsBlock(W){const RD=W.ref_duels||{};
  return `<h3>Your weapons</h3>${W.suggestions.length?`<ul class="pl-list">${W.suggestions.map(s=>`<li class="${s.kind==="weapon_weak"?"avoid":/strong/.test(s.kind)?"exploit":"coach"}">${esc(s.text)}</li>`).join("")}</ul>`:""}
   <div class="tbl"><table><thead><tr><th>Main weapon of the round</th><th class="n">Rounds</th><th class="n">Kills / round</th><th class="n">Damage / round</th><th class="n">Survival</th><th class="n">Rounds won</th><th class="n">Duels won: you · base</th></tr></thead><tbody>
   ${W.by_weapon.map(x=>{const d=W.duels[x.key],r=RD[x.key];return `<tr><td>${esc(x.key)}</td><td class="n">${x.rounds}</td><td class="n">${f1(x.kpr)}</td><td class="n">${x.adr}</td><td class="n">${x.survival}%</td><td class="n">${x.win}%</td>
     <td class="n ${d&&r!=null&&d.n>=10?(d.win>=r+8?"good":d.win<=r-8?"bad":""):""}">${d?`${d.win}% <span class="note">(${d.n})</span>`:"—"} · ${r!=null?r+"%":"—"}</td></tr>`}).join("")}
   </tbody></table></div>
   ${W.force&&W.force.length?`<p class="note"><b>On force-buys:</b> ${W.force.filter(x=>x.rounds>=2).map(x=>`${esc(x.key)} ${x.adr} damage/round (${x.rounds} rounds)`).join(" · ")}</p>`:""}
   <p class="note">Over ${W.n_rounds} analyzed rounds. Duels: kills and deaths with the weapon in hand, compared with every player of the base.</p>`}
function buysBlock(B){if(!B||!B.types)return "";const T=B.types;
  return `<h3>Your buys by type of round</h3>

   ${["pistol","eco","force","full","anti-eco"].filter(k=>T[k]).map(k=>{const x=T[k],b=x.kits[0];return `<tr><td><b>${esc(x.label)}</b></td><td class="n">${x.rounds}</td><td class="n">${x.win??"—"}% · ${x.peer_win??"—"}%</td>

     <td class="wrap">${x.kits.slice(1).map(y=>esc(y.key)).join("<br>")||"—"}</td></tr>`}).join("")}</tbody></table></div>`}

    ${e.top_rule?`<span class="note">Priority: ${esc(e.top_rule)}</span>`:""}</button>`).join("")||`<div class="empty">No player matches.</div>`}</div>
  <div class="card"><h3>Analyze any player</h3>
    <p>${D.local?"Paste their Steam profile link, SteamID64 or custom URL name in the search bar at the top: the analysis runs on your PC.":"In the local version (double-click <code>Coach CS2.bat</code>), paste their Steam profile link or SteamID64 in the search bar at the top. This published page can only show players already analyzed."}</p>
    <p class="note">Demo sources: the ones already downloaded, their recent matchmaking matches via Leetify (about a month), their share codes (<code>--sharecode</code>) or their whole history with their authentication code (<code>--authcode</code>). Without demos, a light profile is built from their Leetify stats.</p></div>`;
  const jf=$("#jf",v);jf.oninput=()=>{jq=jf.value.trim().toLowerCase();const pos=jf.selectionStart;renderPlayers();const n=$("#jf");n.focus();n.setSelectionRange(pos,pos)};
  $$("[data-sort]",v).forEach(b=>b.onclick=()=>{jsort=b.dataset.sort;renderPlayers()});
  $$("[data-pid]",v).forEach(b=>b.onclick=()=>{setPlayer(b.dataset.pid).then(()=>go(b.dataset.pid===D.own?"ingame":"analysis"))});
}

// ---------- view: pros ----------
let PROS=null,pq="",proSel=null;
async function loadPros(){if(PROS)return PROS;try{const r=await fetch("pros.json");PROS=r.ok?await r.json():[]}catch(e){PROS=[]}return PROS}
function proDetail(x){const st=x.stats;const n=(v,s="")=>v==null?"—":String(v)+s;
  return `<article class="card prodetail"><div class="arch-h"><span class="ic" aria-hidden="true">${x.icon}</span><span class="nm">${esc(x.handle)}</span>
    ${x.prole==="igl"?`<span class="probadge">IGL</span>`:""}<span class="note">${esc(x.real_name||"")}${x.team?` · ${esc(x.team)}`:""} · ${esc(x.role_name)}</span>
    <a href="${esc(x.hltv)}" target="_blank" rel="noopener" style="color:var(--ct);font-size:13px">See on HLTV</a></div>
    ${x.traits.length?`<div class="traits">${x.traits.map(t=>`<span title="${esc(t.text)}">${esc(t.label)}</span>`).join("")}</div>`:""}
    <div class="kv"><div><b>${n(st.kpr)}</b><span>kills per round</span></div><div><b>${n(st.hs,"%")}</b><span>headshot kills</span></div>
      <div><b>${n(st.open_win,"%")}</b><span>opening duels won</span></div><div><b>${n(st.trade_rate)}</b><span>trades per round</span></div>
      <div><b>${n(st.iso_T==null?null:Math.round(st.iso_T)," u")}</b><span>distance to teammate as T</span></div><div><b>${n(st.util_pr)}</b><span>grenades per round</span></div>
      <div><b>${n(st.late_share,"%")}</b><span>kills after 60 s</span></div><div><b>${n(st.first_duel_t," s")}</b><span>first duel of the round</span></div></div>
    <div><span class="lbl4" style="color:var(--muted)">Weapons (share of kills)</span>
      <div class="wbar">${Object.entries(x.weapons).filter(([k,v])=>v>0).map(([k,v])=>`<i style="width:${v}%;background:${WCOL[k]||"var(--muted)"}" title="${esc(k)} ${v}%"></i>`).join("")}</div>
      <div class="wleg">${Object.entries(x.weapons).filter(([k,v])=>v>0).map(([k,v])=>`<span><b style="background:${WCOL[k]||"var(--muted)"}"></b>${esc(k)} ${v}%</span>`).join("")}</div>
      ${x.top_weapons.length?`<p class="note">Favorites: ${x.top_weapons.slice(0,3).map(w=>`${esc(w.weapon)} (${w.kills})`).join(", ")}</p>`:""}</div>
    <span class="lbl4" style="color:var(--muted)">Zones played per map (${x.maps} map${x.maps>1?"s":""}, ${x.rounds} rounds)</span>
    <div class="zmaps">${Object.entries(x.zones).map(([m,sd])=>`<div><b>${MAPN(m)}</b>${["T","CT"].filter(k=>sd[k]).map(k=>`<br><span class="note">${k}:</span> ${sd[k].map(z=>`${esc(z.zone)} ${z.share}%`).join(" · ")}`).join("")}</div>`).join("")}</div>
  </article>`}
async function renderPros(){const v=$("#v-pros");const ps=await loadPros();
  const list=ps.filter(x=>!pq||[x.handle,x.real_name,x.team,x.role_name].some(t=>(t||"").toLowerCase().includes(pq)));
  const sel=ps.find(x=>x.steamid===proSel);
  v.innerHTML=`<div class="head"><div style="display:grid;gap:4px"><span class="eyebrow">${ps.length} pro players analyzed on their recent match demos (HLTV)</span><h2>Pros</h2></div></div>
   ${sel?proDetail(sel):""}
   <div class="btns" style="align-items:center"><input id="pf" type="search" value="${esc(pq)}" placeholder="Filter by handle, name, team or role" aria-label="Filter pros" style="font:14px var(--f-body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:6px 10px;min-width:260px"></div>
   <div class="players">${list.map(x=>`<button type="button" class="pcard" data-pro="${x.steamid}" aria-pressed="${x.steamid===proSel}"><b>${esc(x.handle)}${x.prole==="igl"?`<span class="probadge">IGL</span>`:""}</b>
     <span class="note">${esc(x.team||"")}${x.real_name?` · ${esc(x.real_name)}`:""}</span><span class="arch-tag" style="margin:0">${x.icon} ${esc(x.role_name)}</span>
     <span class="note">${x.traits.slice(0,3).map(t=>esc(t.label)).join(" · ")}</span></button>`).join("")||`<div class="empty">No pro matches.</div>`}</div>
   <p class="note">Pros without a recent demo (team absent from the downloaded matches) don't show up yet. Pros' Steam profiles: public community guides on Steam.</p>`;
  const pf=$("#pf",v);pf.oninput=()=>{pq=pf.value.trim().toLowerCase();const pos=pf.selectionStart;renderPros().then(()=>{const n=$("#pf");n.focus();n.setSelectionRange(pos,pos)})};
  $$("[data-pro]",v).forEach(b=>b.onclick=()=>{proSel=b.dataset.pro;renderPros();window.scrollTo(0,0)});
}
function openPro(sid){proSel=sid;go("pros")}

// ---------- search ----------
function playerOptions(){}
function findKnown(q){const t=q.trim(),low=t.toLowerCase().replace(/\/+$/,"");const id=(t.match(/7656\d{13}/)||[])[0];const I=IDX();if(id)return I[id]?id:null;
  const van=(low.match(/\/id\/([^\/?#]+)/)||[])[1]||(!/[\/:]/.test(low)?low:null);
  for(const e of D.index){if((e.name||"").toLowerCase()===low||(van&&(e.vanity||"").toLowerCase()===van))return e.steamid}
  return null}
function jobPanel(html,cls){const j=$("#job");j.hidden=false;const box=$(".in",j);box.className="in "+(cls||"");box.innerHTML=html+`<div><button type="button" class="close">Close</button></div>`;$(".close",box).onclick=()=>{j.hidden=true}}
let polling=null,partialShown=null;
async function startAnalysis(q){
  $("#qbtn").disabled=true;
  try{const r=await fetch("/api/analyze?q="+encodeURIComponent(q));const j=await r.json();
    if(!r.ok){jobPanel(`<b>${esc(j.error||"Error")}</b>${j.query?` (${esc(j.query)})`:""}`,"err");$("#qbtn").disabled=false;if(r.status===409)poll();return}
    poll()}catch(e){jobPanel(`<b>The local server doesn't answer.</b> Restart "Coach CS2.bat".`,"err");$("#qbtn").disabled=false}}
function poll(){clearTimeout(polling);polling=setTimeout(async()=>{
  let j;try{j=await (await fetch("/api/job")).json()}catch(e){return poll()}
  const logs=(j.log||[]).slice(-60).map(esc).join("\n");
  if(j.running){
    if(j.partial&&partialShown!==j.partial){partialShown=j.partial;try{D.index=await (await fetch(`index.json?t=${Date.now()}`)).json();playerOptions();delete D.players[j.partial];await setPlayer(j.partial,true);go(j.partial===D.own?"ingame":"analysis")}catch(e){}}
    jobPanel(`<div class="row"><b><span class="spin" aria-hidden="true"></span>${partialShown?"First preview shown. Full demo analysis running…":`Analyzing ${esc(j.query)}…`}</b><span class="note">The profile completes itself at the end (from a few seconds to a few minutes).</span></div><pre>${logs||"Starting…"}</pre>`);poll();return}
  $("#qbtn").disabled=false;
  if(j.error){jobPanel(`<b>${esc(j.error)}</b><pre>${logs}</pre>`,"err");return}
  if(j.players&&j.players.length){D.index=await (await fetch(`index.json?t=${Date.now()}`)).json();
    jobPanel(`<b>${j.players.length} players analyzed in this match.</b><div class="btns">${j.players.map(p=>`<button type="button" data-mp="${p.steamid}">${esc(p.name)}</button>`).join("")}</div><pre>${logs}</pre>`,"ok");
    $$("[data-mp]",$("#job")).forEach(b=>b.onclick=()=>{delete D.players[b.dataset.mp];setPlayer(b.dataset.mp,true).then(()=>go("analysis"))});return}
  if(j.steamid){try{D.index=await (await fetch(`index.json?t=${Date.now()}`)).json();playerOptions();delete D.players[j.steamid];
      await setPlayer(j.steamid,true);S.map=null;const p=P();
      jobPanel(`<b>${esc(p.name)} is analyzed.</b> ${p.light?"Light profile (Leetify stats, no demo available).":`${p.matches.length} demo(s) analyzed.`}<pre>${logs}</pre>`,"ok");go(j.steamid===D.own?"ingame":"analysis")}
    catch(e){jobPanel(`<b>Nothing to show for this player.</b><pre>${logs}</pre>`,"err")}}},1000)}
$("#search").addEventListener("submit",async e=>{e.preventDefault();const q=$("#q").value.trim();if(!q)return;
  const ps=await loadPros(),ql=q.toLowerCase(),idm=(q.match(/7656\d{13}/)||[])[0];
  const pro=ps.find(x=>x.handle.toLowerCase()===ql||x.steamid===idm);
  if(pro){$("#q").value="";$("#job").hidden=true;openPro(pro.steamid);return}
  const known=findKnown(q);
  if(known){await setPlayer(known);$("#job").hidden=true;$("#q").value="";go(S.view==="players"?"ingame":S.view);
    if(D.local){jobPanel(`<b>${esc(P().name)} is already analyzed.</b> To fetch their new matches: <button type="button" class="close" id="refresh">Update</button>`,"ok");$("#refresh").onclick=()=>startAnalysis(q)}
    return}
  if(D.local){partialShown=null;startAnalysis(q);return}
  const local=`http://127.0.0.1:8765/?q=${encodeURIComponent(q)}#ingame`;
  jobPanel(`<b>This player isn't in this page yet.</b><p>The analysis runs on your PC. Click below: the local app opens in a new tab and starts the analysis right away (a first preview in seconds, the full profile in a few minutes).</p>
    <p><a href="${esc(local)}" target="_blank" rel="noopener" style="display:inline-block;font:600 15px var(--f-body);padding:8px 14px;background:var(--ink);color:var(--bg);border-radius:3px;text-decoration:none">Analyze on my PC</a></p>
    <p class="note">The local app must be running: double-click <code>Coach CS2.bat</code> in the app folder, or turn on its automatic start with <code>autostart.bat</code>.</p>`)});

// ---------- routing ----------
const RENDER={ingame:renderIngame,review:renderReview,analysis:renderAnalysis,routine:renderRoutine,midround:renderMidround,progress:renderProgress,team:renderTeam,matches:renderMatches,maps:renderMaps,players:renderPlayers,pros:renderPros,settings:renderSettings};
function go(view){view=ALIAS[view]||view;if(location.hash!=="#"+view)history.replaceState(null,"",location.pathname+location.search+"#"+view);show(view)}
function show(view){view=ALIAS[view]||view;if(!RENDER[view])view="ingame";if(location.hash.slice(1)!==view)history.replaceState(null,"",location.pathname+location.search+"#"+view);
  S.view=view;$$("main>.view").forEach(x=>x.hidden=x.id!=="v-"+view);
  navUpdate(view);if(view!=="ingame")clearTimeout(gsiTimer);
  if(view==="players"){renderPlayers();return}
  if(view==="pros"){renderPros();window.scrollTo(0,0);return}
  if(view==="settings"){renderSettings();window.scrollTo(0,0);return}
  if(view==="team"){renderTeam();window.scrollTo(0,0);return}
  if(!S.player){if(view==="ingame"||view==="review")welcome($("#v-"+view));else $("#v-"+view).innerHTML=`<div class="empty">Pick a profile first: yours from the home page, or anyone in Explore.</div>`;return}
  if(!D.players[S.player]){$("#v-"+view).innerHTML=`<div class="empty"><span class="spin" aria-hidden="true"></span>Loading the profile…</div>`;return}
  RENDER[view]();navUpdate(view);window.scrollTo(0,0);
  if(view==="ingame"&&D.local){if(!gsiStatus)fetch("/api/gsi/status").then(r=>r.json()).then(j=>{gsiStatus=j;if(S.view==="ingame"&&D.players[S.player])renderIngame()}).catch(()=>{});gsiPoll()}}
async function setPlayer(id,force){S.player=id;store("player",id);S.match=0;if(!id){show(S.view);return}
  if(!D.players[id]||force){show(S.view);try{await loadPlayer(id,force)}catch(e){$("#v-"+S.view).innerHTML=`<div class="empty">Couldn't load this profile (${esc(e.message)}).</div>`;return}}
  show(S.view)}
S.map=store("map");S.side=store("side")||"T";
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
S.view=ALIAS[location.hash.slice(1)]||location.hash.slice(1)||"ingame";if(!RENDER[S.view])S.view="ingame";
if(store("focus"))document.body.classList.add("focus");
const sp=store("player");
setPlayer(sp&&IDX()[sp]?sp:(D.own&&IDX()[D.own]?D.own:(D.local&&D.own?null:(D.default||(D.index[0]||{}).steamid||null))));
if(D.local){
  const q0=new URLSearchParams(location.search).get("q");
  if(q0){history.replaceState(null,"",location.pathname+location.hash);$("#q").value=q0;$("#search").requestSubmit()}
  else fetch("/api/job").then(r=>r.json()).then(j=>{if(j.running)poll()}).catch(()=>{});
}
</script>
