<title>CS2 Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: tactical app, sticky top bar (views + player), each view a full-width sheet */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d5dce3;
  --ct:#2f6fb3; --t:#c98a1a; --good:#2e8b57; --bad:#c2413a; --warn:#b7791f; --chip:#e3e8ee; --radar-bg:#0e1319;
  --smoke:#9aa7b4; --flash:#e8d44d; --molotov:#e0663a; --he:#5fb85f;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ee; --muted:#93a0ad; --line:#2b3540;
  --ct:#5b9be0; --t:#e0a63c; --good:#4cb87a; --bad:#e2665f; --warn:#d9a043; --chip:#232c36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ee; --muted:#93a0ad; --line:#2b3540;
  --ct:#5b9be0; --t:#e0a63c; --good:#4cb87a; --bad:#e2665f; --warn:#d9a043; --chip:#232c36; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:20px;font-weight:600}
p{margin:0}
ul,ol{margin:0;padding-left:20px} li{margin:4px 0}
code{font-family:var(--f-mono);font-size:12px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.note{font-size:13px;color:var(--muted);max-width:80ch}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.brand{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.02em}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{font:500 14px var(--f-body);color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:3px}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav a:focus-visible{outline:2px solid var(--ct)}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.who select{font:500 14px var(--f-body);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:5px 8px;max-width:220px}
main{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}
.view{display:grid;gap:26px}
/* shared */
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{font:500 13px var(--f-body);padding:5px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:3px;cursor:pointer}
.btns button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btns button:focus-visible{outline:2px solid var(--ct);outline-offset:2px}
.btns.side button[data-side="T"][aria-pressed="true"]{background:var(--t);border-color:var(--t);color:#1a1206}
.btns.side button[data-side="CT"][aria-pressed="true"]{background:var(--ct);border-color:var(--ct);color:#fff}
.btns.big button{font:600 17px var(--f-display);letter-spacing:.03em;padding:7px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:600 16px var(--f-display);letter-spacing:.03em;padding:6px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;cursor:pointer}
.chips button small{font:500 11px var(--f-mono);color:var(--muted);margin-left:6px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)} .chips button[aria-pressed="true"] small{color:var(--bg)}
.chips button:focus-visible{outline:2px solid var(--ct);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px 18px;display:grid;gap:10px;min-width:0}
.tbl{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;vertical-align:bottom}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.wrap{white-space:normal}
td.good,.good{color:var(--good);font-weight:600} td.bad,.bad{color:var(--bad);font-weight:600}
td.grp{font-family:var(--f-display);font-size:16px;font-weight:600;background:var(--bg)}
tr.click{cursor:pointer} tr.click:hover td{background:color-mix(in srgb,var(--ink) 4%,transparent)}
tr[aria-selected="true"] td{background:color-mix(in srgb,var(--ct) 12%,transparent)}
.res{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:10px}
.res.win{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.res.loss{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.res.draw{background:var(--chip);color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:9px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.strong{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.weak{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.empty{background:var(--panel);border:1px dashed var(--line);padding:16px;color:var(--muted)}
.finding{background:var(--panel);border:1px solid var(--line);display:grid;grid-template-columns:52px 1fr;min-width:0}
.finding .rank{font-family:var(--f-display);font-size:34px;font-weight:700;display:flex;justify-content:center;padding-top:12px;border-right:1px solid var(--line);color:var(--muted)}
.finding.high .rank{color:var(--bad)} .finding.mid .rank{color:var(--warn)}
.finding .body{padding:14px 18px;display:grid;gap:8px;min-width:0}
.fix{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:4px}
.fix h4,.lbl4{margin:0;font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--good)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:3px;background:var(--chip);color:var(--muted);margin-right:6px}
/* radar */
.radar-box{background:var(--radar-bg);border:1px solid var(--line);display:grid;min-width:0}
.radar-box>.btns{padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
svg.radar{display:block;width:100%;height:auto}
.caption{background:var(--panel);padding:8px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px}
.caption i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.zlabel{font:600 13px var(--f-display);fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px}
.zsmall{font:500 10.5px var(--f-mono);fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px}
/* pre-game board */
.pg-top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.pg-grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr) minmax(300px,420px);gap:18px;align-items:start}
@media (max-width:1180px){.pg-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pg-grid .always{grid-column:1/-1}}
@media (max-width:760px){.pg-grid{grid-template-columns:1fr}}
.always{background:var(--ink);color:var(--bg);padding:16px 18px;display:grid;gap:12px;align-content:start;border-radius:2px}
.always h3{color:var(--bg);font-size:22px;text-transform:uppercase;letter-spacing:.05em}
.always ol{padding-left:0;list-style:none;counter-reset:r;display:grid;gap:10px;margin:0}
.always li{counter-increment:r;display:grid;grid-template-columns:28px 1fr;gap:6px;margin:0}
.always li::before{content:counter(r);font:700 24px var(--f-display);color:var(--flash);line-height:1}
.always li b{font:600 18px var(--f-display);letter-spacing:.02em;display:block;line-height:1.15}
.always li span{font-size:12.5px;opacity:.75}
.always .str{border-top:1px solid color-mix(in srgb,var(--bg) 25%,transparent);padding-top:10px;font-size:12.5px;opacity:.85}
.plan{display:grid;gap:12px;align-content:start}
.rec{display:flex;gap:14px;align-items:baseline;font-family:var(--f-display);font-size:18px}
.rec b{font-size:28px}
.pl-list{list-style:none;padding:0;display:grid;gap:8px;margin:0}
.pl-list li{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);padding:8px 12px;font-size:14px;margin:0}
.pl-list li.exploit{border-left-color:var(--good)} .pl-list li.avoid{border-left-color:var(--bad)} .pl-list li.timing{border-left-color:var(--warn)} .pl-list li.coach{border-left-color:var(--ct)} .pl-list li.try{border-left-color:var(--flash)}
.lineups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.plan .lineups{grid-template-columns:1fr}
.lu{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--smoke);padding:9px 12px;display:grid;gap:5px;font-size:13.5px;cursor:pointer;min-width:0}
.lu[data-type="flash"]{border-left-color:var(--flash)} .lu[data-type="molotov"]{border-left-color:var(--molotov)} .lu[data-type="he"]{border-left-color:var(--he)}
.lu.sel{outline:2px solid var(--ink)}
.lu .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lu .ty{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lu .route{font-weight:600}
.lu .meta{color:var(--muted);font-size:12.5px}
.cmd{display:flex;gap:6px;align-items:center;min-width:0}
.cmd code{flex:1;min-width:0;font-size:11px;background:var(--bg);border:1px solid var(--line);padding:4px 6px;overflow-x:auto;white-space:nowrap}
.cmd button{font:500 12px var(--f-body);padding:4px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:3px;cursor:pointer}
/* synthese / matchs */
.head{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
.record{display:flex;gap:18px;font-family:var(--f-display);font-size:28px;font-weight:600}
.record small{display:block;font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--panel);padding:10px 14px;display:grid;gap:2px}
.stat>b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.stat>span{font-size:12px;color:var(--muted)}
.strengths{display:flex;flex-wrap:wrap;gap:8px}
.strengths span{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good);font-size:13px;padding:4px 10px;border-radius:14px}
.stage{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:920px){.stage{grid-template-columns:1fr}}
.timeline-wrap{overflow-x:auto}
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(30px,1fr);gap:3px}
.rd{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--muted);padding:4px 2px;text-align:center;font-family:var(--f-mono);font-size:11px;display:grid;gap:1px}
.rd.T{border-top-color:var(--t)} .rd.CT{border-top-color:var(--ct)}
.rd .w{color:var(--good);font-weight:600} .rd .l{color:var(--bad);font-weight:600}
/* cartes */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.cmp{display:grid;gap:5px;font-size:13px}
.cmp .row{display:grid;grid-template-columns:minmax(0,1fr) 130px 44px;gap:8px;align-items:center}
.cmp .lb{color:var(--muted)}
.meter{height:9px;background:var(--chip);border-radius:2px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--good)}
.meter.low i{background:var(--bad)} .meter.oth i{background:var(--muted);opacity:.6}
.cmp .v{font-family:var(--f-mono);text-align:right}
.tech{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.tech div{background:var(--panel);border:1px solid var(--line);padding:12px 14px;font-size:14px}
.tech b{display:block;font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.zl h4{margin:0 0 4px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.zl.ex h4{color:var(--good)} .zl.av h4{color:var(--bad)} .zl.fr h4{color:var(--muted)}
.zl ul{font-size:14px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);padding:14px 16px;display:grid;gap:4px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.pcard[aria-pressed="true"]{outline:2px solid var(--ink)}
.pcard b{font-family:var(--f-display);font-size:22px}
.search{display:flex;gap:6px;align-items:center;flex:1 1 320px;max-width:520px}
.search input{flex:1;min-width:0;font:14px var(--f-body);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:6px 10px}
.search input:focus-visible{outline:2px solid var(--ct);outline-offset:1px}
.search button{font:600 14px var(--f-body);padding:6px 12px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:3px;cursor:pointer}
.search button:disabled{opacity:.5;cursor:progress}
.jobpanel{max-width:1400px;margin:12px auto 0;padding-inline:16px}
.jobpanel .in{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ct);padding:14px 16px;display:grid;gap:10px}
.jobpanel .in.err{border-left-color:var(--bad)} .jobpanel .in.ok{border-left-color:var(--good)}
.jobpanel .row{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.jobpanel pre{margin:0;max-height:220px;overflow:auto;background:var(--radar-bg);color:#dfe6ec;font:12px/1.55 var(--f-mono);padding:10px 12px;border-radius:2px;white-space:pre-wrap}
.jobpanel .close{font:500 13px var(--f-body);background:none;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:3px 9px;cursor:pointer}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--ct);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;margin-right:6px;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.bench{display:grid;gap:4px;font-size:13px}
.bench .row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(90px,1fr) 150px;gap:10px;align-items:center}
.bench .lb{min-width:0}
.pbar{height:10px;background:var(--chip);border-radius:2px;position:relative}
.pbar i{position:absolute;inset:0 auto 0 0;border-radius:2px}
.pbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:50%}
.bench .v{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.standing{font-family:var(--f-mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);padding:6px 10px;display:grid;gap:2px}
.standing .tg{color:var(--good)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.srcs a{color:var(--ct);text-decoration:none;border:1px solid var(--line);padding:2px 8px;border-radius:12px}
.srcs a:hover{text-decoration:underline}
.drills{margin:0;padding-left:18px;font-size:14px}
.arch{display:grid;gap:14px}
.arch-h{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.arch-h .nm{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.arch-h .ic{font-size:30px}
.arch-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.arch-grid{grid-template-columns:1fr}}
.roles{display:grid;gap:4px;font-size:13px}
.roles .row{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center}
.roles .row.main{font-weight:600}
.roles .meter i{background:var(--muted)} .roles .row.main .meter i{background:var(--ct)}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.traits span{font:600 12.5px var(--f-body);padding:3px 10px;border-radius:14px;background:color-mix(in srgb,var(--ct) 16%,transparent);color:var(--ct);cursor:help}
.wbar{display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--chip)}
.wbar i{display:block;height:100%}
.wleg{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.wleg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.desc{margin:0;display:grid;gap:6px;font-size:14px}
.arch-tag{display:inline-block;font:600 12px var(--f-body);color:var(--ct);margin-left:8px}
.pros{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pro{background:var(--bg);border:1px solid var(--line);padding:10px 12px;display:grid;gap:4px;font-size:13.5px}
.pro .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pro b{font-family:var(--f-display);font-size:19px}
.pro .sim{font:600 13px var(--f-mono);color:var(--good)}
.pro a{color:var(--ct);text-decoration:none;font-size:12.5px}
.probadge{font:600 11px var(--f-mono);padding:1px 6px;border-radius:9px;background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);margin-left:6px}
.prodetail{display:grid;gap:14px}
.prodetail .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.prodetail .kv div{background:var(--panel);padding:8px 12px;display:grid;gap:2px}
.prodetail .kv b{font-family:var(--f-display);font-size:22px}
.prodetail .kv span{font-size:12px;color:var(--muted)}
.zmaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.zmaps div{background:var(--bg);border:1px solid var(--line);padding:8px 10px;font-size:13px}
.rp-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.rp-ctl input[type=range]{flex:1;min-width:160px}
.rp-ctl .rp-time{font:600 13px var(--f-mono);min-width:52px;text-align:right}
.rp-host{max-width:760px}
.rp-rounds{display:flex;flex-wrap:wrap;gap:3px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.rp-rounds button{font:500 12px var(--f-mono);min-width:30px;padding:3px 5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:3px;cursor:pointer}
.rp-rounds button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rp-rounds button.T{border-top:3px solid var(--t)} .rp-rounds button.CT{border-top:3px solid var(--ct)}
.rp-feed{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px;font-size:12.5px;max-height:140px;overflow:auto;display:grid;gap:2px}
.pname{font:600 10px var(--f-mono);fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px}
.gauge{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.gauge div{border:1px solid var(--line);padding:12px 14px;display:grid;gap:4px;background:var(--bg)}
.gauge b{font-family:var(--f-display);font-size:30px;line-height:1}
.gauge span{font-size:12.5px;color:var(--muted)}

.miss{margin:8px 0;padding:8px 12px;border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--panel));border-radius:var(--radius);font-size:14px}
/* full-screen side panel: visual only, read in a glance */
.vz{display:grid;gap:10px}
.vz .olegend{display:none}
.vz .obar{height:44px;font:700 18px var(--f-display)}

.vsit b{font:700 34px var(--f-display);letter-spacing:0}
.vrule{display:flex;align-items:center;gap:8px;font:600 15px var(--f-body);padding:6px 10px;border-radius:var(--radius);background:color-mix(in srgb,var(--panel) 80%,transparent)}
.vrule i{font-style:normal;font-size:20px}.vrule span{flex:1}.vrule b{font:700 22px var(--f-display)}.vrule em{font-style:normal;color:var(--muted)}
.vz .good{color:var(--good)}.vz .warn{color:var(--warn)}.vz .bad{color:var(--bad)}
.vbig{display:grid;justify-items:start;padding:8px 12px;border-radius:var(--radius);border-left:6px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}
.vbig b{font:700 34px var(--f-display);line-height:1}.vbig span{font:600 13px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.vtl{position:relative;display:flex;height:48px;border-radius:var(--radius);overflow:hidden;gap:2px}
.vseg{display:grid;place-content:center;justify-items:center;background:color-mix(in srgb,currentColor 28%,transparent);font:600 11px var(--f-mono);text-transform:uppercase}
.vseg b{font:700 18px var(--f-display);text-transform:none}.vseg.past{opacity:.25}
.vcur{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 6px #000}
.vdots{display:flex;align-items:center;gap:6px;font:600 14px var(--f-mono)}.vdots b{font-size:20px;letter-spacing:2px;color:var(--ct)}.vdots em{color:var(--muted);font-style:normal}.vdots small{color:var(--muted);margin-left:auto}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{font:600 14px var(--f-body);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}.vchip b{font-weight:700}.vchip small{color:var(--muted)}
.vnades{display:flex;flex-wrap:wrap;gap:6px}
.vnade{display:flex;align-items:center;gap:6px;font:600 15px var(--f-body);padding:4px 10px 4px 4px;border-radius:999px;border:2px solid var(--c);background:var(--panel)}
.vnade i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:#111;font:700 14px var(--f-mono);font-style:normal}
.vnade small{color:var(--muted);font:500 12px var(--f-mono)}.vnade.keep{opacity:.45;border-style:dashed}.vnade.now{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent)}
.vyou{display:flex;align-items:baseline;gap:6px;font:600 13px var(--f-mono);padding:4px 10px;border-radius:var(--radius);border:1px dashed var(--line)}
.vyou span{font-weight:700;letter-spacing:.06em}.vyou b{font:700 20px var(--f-display)}.vyou small{color:var(--muted)}.vyou em{font-style:normal;margin-left:6px}
/* compact buy notification: never scrolls */
.ig-toast{max-height:none;overflow:visible;width:min(420px,92vw)}
.vbuy{display:grid;gap:8px}
.vbuy-h{display:flex;align-items:baseline;gap:10px}.vbuy-h b{font:700 26px var(--f-display)}.vbuy-h span{font:600 16px var(--f-mono);color:var(--muted)}
.vtags{display:flex;flex-wrap:wrap;gap:6px}.vtag{font:700 15px var(--f-body);padding:4px 10px;border-radius:var(--radius);background:color-mix(in srgb,var(--ink) 10%,var(--panel))}.vtag.got{color:var(--good)}
.vbuy .good{color:var(--good)}.vbuy .bad{color:var(--bad)}
.vdest{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:2px 0}
.vdest em{font:700 20px var(--f-display);font-style:normal}.vdest em.sec{font-size:15px;opacity:.6}
.vfights{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;font:700 18px var(--f-display)}.vfights i{font-style:normal}.vfights b{font-size:15px;color:var(--muted)}
/* side panel: one option per line (label, bar, number) */
.vhead{font:700 12px var(--f-mono);letter-spacing:.08em;color:var(--muted);margin:2px 0 -4px}
.vrows{display:grid;gap:5px}

.vodds .vrow{grid-template-columns:1.4em minmax(0,1fr) 3em;font-size:22px}.vodds .vrow i{height:20px;border-radius:10px}.vodds .vrow u{border-radius:10px}
.vodds .vrow span{color:var(--c)}
svg.radar .mkt.o{fill:#eef2f6}
.vrow:has(small){grid-template-columns:minmax(0,7em) minmax(0,1fr) 3em 3.6em}

table.lc{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}table.lc th,table.lc td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}table.lc th{font:600 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}table.lc .good{color:var(--good)}table.lc .bad{color:var(--bad)}

<script>
const D=__DATA__;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MAPN=m=>{const n=m.replace(/^(de|cs|ar)_/,"");return n.charAt(0).toUpperCase()+n.slice(1)};
const fmtDate=t=>t?new Date(t).toLocaleString("en-US",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const f1=v=>v==null?"—":String(v);
const TYPE={smoke:"Smoke",flash:"Flash",molotov:"Molotov",he:"HE"};
const RES={win:"Win",loss:"Loss",draw:"Draw"};
const roleOf=(m,s)=>m.startsWith("cs_")?(s==="T"?"defense":"attack"):(s==="T"?"attack":"defense");
const NS="http://www.w3.org/2000/svg";
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
function tip(e,s){const t=document.createElementNS(NS,"title");t.textContent=s;e.appendChild(t);return e}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("cs2c:"+k));localStorage.setItem("cs2c:"+k,JSON.stringify(v))}catch(e){return null}}
function press(scope,sel,b){$$(sel,scope).forEach(x=>x.setAttribute("aria-pressed",x===b))}
function copyBtn(root){$$(".cmd button",root).forEach(b=>b.onclick=e=>{e.stopPropagation();const code=$("code",b.parentNode);
  const sel=()=>{const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText(code.textContent).then(()=>{b.textContent="Copied"},sel)}catch(err){sel()}})}
function tabs(host,key,items,cur){ // accessible tab bar; items [[key,label]]
  return `<div class="tabs" role="tablist" aria-label="${esc(key)}">${items.map(([k,t])=>`<button type="button" role="tab" data-tab="${key}:${k}" aria-selected="${k===cur}">${t}</button>`).join("")}</div>`}

// ---------- state ----------
const S={player:null,view:"ingame",map:null,side:"T",level:null,match:0,cmap:null};
const P=()=>D.players[S.player];
// hostage maps (cs_*) play differently (no bomb sites): after the bomb maps, under their own label
const HOST=m=>/^cs_/.test(m||"");
const bombFirst=(a,f=x=>x)=>[...a.filter(x=>!HOST(f(x))),...a.filter(x=>HOST(f(x)))];
const chipSep=(a,i,f=x=>x)=>HOST(f(a[i]))&&(i===0||!HOST(f(a[i-1])))?`<span class="chip-sep">Hostage maps</span>`:"";
function mapsOf(p){let c=(p.cross.maps||[]).map(m=>({map:m.map,n:m.matches}));
  const lb=(p.advice.leetify||{}).by_map||{};if(!c.length)c=Object.entries(lb).map(([map,b])=>({map,n:b.n}));
  if(!c.length)c=((p.advice.csstats||{}).maps||[]).map(m=>({map:m.map,n:m.wins}));return bombFirst(c.sort((a,b)=>b.n-a.n),x=>x.map)}
function extrasBlock(p,compact){const st=p.advice.steam,cs=p.advice.csstats;if(!st&&!cs)return "";
  const fmtR=v=>v==null?"—":v.toLocaleString("en-US");
  return `<div class="card"><div style="display:flex;gap:12px;align-items:center">${st&&st.avatar?`<img src="${esc(st.avatar)}" alt="" width="48" height="48" style="border-radius:3px">`:""}
    <div><h3>${compact?"Public rankings":"Public profile and rankings"}</h3><span class="note">${st?[st.member_since?`Steam account since ${esc(st.member_since)}`:"",st.location?esc(st.location):"",st.vac_banned?"<b class='bad'>VAC ban on record</b>":""].filter(Boolean).join(" · "):""}</span></div></div>
    ${cs&&cs.premier&&cs.premier.length?`<div class="tbl"><table><thead><tr><th>Premier</th><th class="n">Wins</th><th class="n">Current</th><th class="n">Best</th></tr></thead><tbody>${cs.premier.map(x=>`<tr><td>${esc(x.season)} · ${x.year}</td><td class="n">${esc(x.wins??"—")}</td><td class="n">${fmtR(x.current)}</td><td class="n">${fmtR(x.best)}</td></tr>`).join("")}</tbody></table></div>`:""}
    ${cs&&cs.competitive?`<p class="note">Competitive: ${esc(cs.competitive.current||"—")} (best ${esc(cs.competitive.best||"—")}) · ${cs.competitive.wins} wins · last match ${esc(cs.competitive.last_match)}</p>`:""}
    ${cs&&cs.maps&&cs.maps.length?`<div class="tbl"><table><thead><tr><th>Map</th><th>Competitive rank</th><th class="n">Wins</th></tr></thead><tbody>${cs.maps.map(m=>`<tr><td>${MAPN(m.map)}</td><td>${esc(m.rank_name)||'<span class="note">Unranked</span>'}</td><td class="n">${m.wins}</td></tr>`).join("")}</tbody></table></div>`:""}
    ${cs&&cs.crosshair?`<span class="lbl4" style="color:var(--muted)">Their crosshair</span><div class="cmd"><code>${esc(cs.crosshair)}</code><button type="button">Copy</button></div>`:""}
    <p class="note">Sources: ${st?`<a href="${esc(st.url)}" target="_blank" rel="noopener">Steam profile</a>`:""}${cs?` · <a href="${esc(cs.url)}" target="_blank" rel="noopener">csstats.gg</a>`:""}</p></div>`}
function leetMap(p,map){const b=((p.advice.leetify||{}).by_map||{})[map];if(!b)return "";
  return `<div class="card"><h3>${MAPN(map)} according to Leetify</h3><div class="stats"><div class="stat"><b class="num">${b.w}/${b.n}</b><span>matches won</span></div>
  <div class="stat"><b class="num">${(b.k/Math.max(b.d,1)).toFixed(2)}</b><span>K/D</span></div><div class="stat"><b class="num">${Math.round(b.dmg/Math.max(b.rounds,1))}</b><span>ADR</span></div></div>
  <p class="note">No recent demo of this player: no positions or grenades yet. FACEIT demos need a FACEIT API key. Matchmaking demos are fetched automatically while Valve keeps them (about 1 month).</p></div>`}
function leetBlock(p){const L=p.advice.leetify;if(!L)return "";const r=L.ratings||{},st=L.stats||{};
  const n=(v,d=0)=>v==null?"—":Number(v).toFixed(d);
  return `<h3>Leetify profile</h3><div class="stats">
   <div class="stat"><b class="num">${n(r.aim)}</b><span>aim rating</span></div><div class="stat"><b class="num">${n(r.positioning)}</b><span>positioning rating</span></div>
   <div class="stat"><b class="num">${n(r.utility)}</b><span>utility rating</span></div><div class="stat"><b class="num">${n(st.preaim,1)}°</b><span>crosshair offset</span></div>
   <div class="stat"><b class="num">${n(st.reaction_time_ms)} ms</b><span>reaction time</span></div><div class="stat"><b class="num">${n(st.counter_strafing_good_shots_ratio)}%</b><span>counter-strafed shots</span></div>
   <div class="stat"><b class="num">${n(st.traded_deaths_success_percentage)}%</b><span>tradable deaths traded</span></div><div class="stat"><b class="num">${n(L.total_matches)}</b><span>matches tracked</span></div></div>
  <div class="tbl"><table><thead><tr><th>Date</th><th>Source</th><th>Map</th><th>Score</th><th class="n">K-D-A</th><th class="n">ADR</th><th class="n">Rating</th></tr></thead><tbody>
  ${(L.recent||[]).map(m=>{const me=m.me||{};const won=me.rounds_won>me.rounds_lost,draw=me.rounds_won===me.rounds_lost;return `<tr><td>${fmtDate(m.time)}</td><td>${m.source==="faceit"?"FACEIT":"Matchmaking"}</td><td>${MAPN(m.map)}</td>
   <td><span class="res ${draw?"draw":won?"win":"loss"}">${me.rounds_won??"?"}-${me.rounds_lost??"?"}</span></td><td class="n">${me.total_kills??"—"}-${me.total_deaths??"—"}-${me.total_assists??"—"}</td>
   <td class="n">${me.dpr==null?"—":Math.round(me.dpr)}</td><td class="n">${me.leetify_rating==null?"—":(me.leetify_rating*100).toFixed(1)}</td></tr>`}).join("")}</tbody></table></div>`}
function crossMap(p,map){return (p.cross.maps||[]).find(m=>m.map===map)}

// ---------- radar (cross data) ----------
function crossRadar(box,m,side,st){
  const svg=$("svg",box),img=$("image",svg),ov=$("g",svg),cap=$(".caption",box);
  const Sd=m.sides[side];img.setAttribute("href",D.radars[`${m.map}:${st.level}`]||"");
  svg.setAttribute("viewBox",(D.viewboxes[m.map]||[0,0,1024,1024]).join(" "));ov.replaceChildren();
  if(!Sd){cap.innerHTML="<span>No data for this side.</span>";return}
  const zm=Object.fromEntries(m.zones_meta.map(z=>[z.key,z])),L=st.level,layers=st.layers;
  const legend=[];
  if(layers.includes("zones")){Sd.zones.forEach(z=>{const meta=zm[z.key];if(!meta||meta.level!==L)return;
    const col=z.verdict==="exploit"?"var(--good)":z.verdict==="avoid"?"var(--bad)":"#8a96a3",r=6+Math.sqrt(z.presence)*4.2;
    tip(el("circle",{cx:meta.px[0],cy:meta.px[1],r,style:`fill:${col};fill-opacity:.72;stroke:#fff;stroke-width:1.5`},ov),`${z.name}: ${Math.round(z.presence)}% of your time, you ${z.k}-${z.d}, others ${z.others_win??"—"}%`);
    el("text",{x:meta.px[0],y:meta.px[1]-r-3,"text-anchor":"middle",class:"zlabel"},ov).textContent=z.name;
    el("text",{x:meta.px[0],y:meta.px[1]+4,"text-anchor":"middle",class:"zsmall"},ov).textContent=`${z.k}-${z.d}`;});
    legend.push('<span><i style="background:var(--good)"></i>play it more</span><span><i style="background:var(--bad)"></i>avoid</span><span><i style="background:#8a96a3"></i>neutral</span><span>size = your time · number = your kills-deaths</span>')}
  if(layers.includes("duels")){Sd.duels.filter(d=>d.level===L).forEach(d=>{
      el("line",{x1:d.opp_px[0],y1:d.opp_px[1],x2:d.px[0],y2:d.px[1],style:`stroke:${d.won?"var(--good)":"var(--bad)"};stroke-width:1.6;stroke-opacity:.7;${d.won?"":"stroke-dasharray:4 3"}`},ov);
      if(d.won)el("circle",{cx:d.px[0],cy:d.px[1],r:5,style:"fill:var(--good);stroke:#fff"},ov);
      else el("path",{d:`M${d.px[0]-5} ${d.px[1]-5}L${d.px[0]+5} ${d.px[1]+5}M${d.px[0]+5} ${d.px[1]-5}L${d.px[0]-5} ${d.px[1]+5}`,style:"stroke:var(--bad);stroke-width:3;stroke-linecap:round"},ov);});
    legend.push('<span><i style="background:var(--good)"></i>duel won</span><span><i style="background:var(--bad)"></i>duel lost</span>')}
  if(layers.includes("best")){Sd.best_spots.filter(b=>b.level===L).forEach(b=>{const [x,y]=b.px;
      tip(el("path",{d:`M${x} ${y-10}L${x+3} ${y-3}L${x+10} ${y-3}L${x+4} ${y+2}L${x+6} ${y+9}L${x} ${y+5}L${x-6} ${y+9}L${x-4} ${y+2}L${x-10} ${y-3}L${x-3} ${y-3}Z`,style:"fill:#ffd24a;stroke:#000;stroke-width:1"},ov),
        `${b.zone}: ${b.k} kills for ${b.d} deaths by other players, ${b.hold_pct}% holding, around ${b.t_med} s`);});
    if(Sd.best_spots.length)legend.push("<span>★ spot where other players win ≥ 65% of their duels</span>")}
  if(layers.includes("nades")){const idx=st.nades||Sd.lineups.map((_,i)=>i);
    idx.forEach(i=>{const l=Sd.lineups[i];if(!l||(l.level!==L&&l.land_level!==L))return;const col=`var(--${l.type})`,sel=st.sel===i,dim=st.sel!=null&&!sel;
      el("line",{x1:l.from_px[0],y1:l.from_px[1],x2:l.to_px[0],y2:l.to_px[1],style:`stroke:${col};stroke-width:${sel?3.5:2.2};stroke-opacity:${dim?.3:1};stroke-dasharray:6 4`},ov);
      el("circle",{cx:l.from_px[0],cy:l.from_px[1],r:sel?6:4,style:`fill:#fff;stroke:${col};stroke-width:2`},ov);
      tip(el("circle",{cx:l.to_px[0],cy:l.to_px[1],r:sel?11:8,style:`fill:${col};fill-opacity:${dim?.3:.85};stroke:#000`},ov),`${TYPE[l.type]} ${l.from_zone} → ${l.to_zone||"?"}`);});
    legend.push('<span><i style="background:var(--smoke)"></i>smoke</span><span><i style="background:var(--flash)"></i>flash</span><span><i style="background:var(--molotov)"></i>molotov</span><span><i style="background:var(--he)"></i>HE</span><span>white dot = thrower</span>')}
  cap.innerHTML=legend.join("");
}
function radarShell(extraBtns=""){return `<div class="radar-box">${extraBtns}<svg class="radar" viewBox="0 0 1024 1024" role="img" aria-label="Radar"><image x="0" y="0" width="1024" height="1024"></image><g></g></svg><div class="caption"></div></div>`}
function lineupCard(l,i){

function findings(list){return (list||[]).map((f,i)=>`<article class="finding ${f.level||(i<2?"high":"mid")}"><div class="rank">${i+1}</div><div class="body">
  ${f.tags&&f.tags.length?`<div>${f.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
  <h3>${esc(f.title)}</h3>${f.evidence&&f.evidence.length?`<ul>${f.evidence.map(e=>`<li>${e}</li>`).join("")}</ul>`:""}
  ${f.standing?`<div class="standing"><span>${esc(f.standing)}</span>${benchExtra(f.bench)}${f.target?`<span class="tg">${esc(f.target)}</span>`:""}</div>`:""}
  ${f.fix&&f.fix.length?`<div class="fix"><h4>Fix</h4><ol>${f.fix.map(e=>`<li>${e}</li>`).join("")}</ol></div>`:""}
  ${f.drills&&f.drills.length?`<div class="fix"><h4>Drills</h4><ul class="drills">${f.drills.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`:""}
  ${f.sources&&f.sources.length?`<div class="srcs"><span class="note">Sources:</span>${f.sources.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("")}</div>`:""}</div></article>`).join("")}
const fmtU=(v,u)=>v==null?"—":((Math.abs(v)<10&&u!=="%")?v.toFixed(1):Math.round(v).toString())+(u==="%"?"%":u);
function benchExtra(bl){if(!bl||!bl.length)return "";const b=bl[0];const parts=[];
  if(b.same!=null)parts.push(`players of your rank ${fmtU(b.same,b.unit)}`);if(b.higher!=null)parts.push(`higher-ranked players ${fmtU(b.higher,b.unit)}`);
  return (parts.length?`<span>${parts.join(" · ")}</span>`:"")+bl.slice(1).map(x=>`<span>${esc(x.label)}: you ${fmtU(x.you,x.unit)} · median ${fmtU(x.median,x.unit)}</span>`).join("")}
const SKILL=["","Silver I","Silver II","Silver III","Silver IV","Silver Elite","Silver Elite Master","Gold Nova I","Gold Nova II","Gold Nova III","Gold Nova Master","Master Guardian I","Master Guardian II","Master Guardian Elite","Distinguished Master Guardian","Legendary Eagle","Legendary Eagle Master","Supreme","Global Elite"];
function benchSection(p){const B=p.advice.bench;if(!B||!B.metrics)return "";
  const rows=Object.entries(B.metrics).filter(([k,m])=>m.you!=null&&m.percentile!=null).sort((a,b)=>a[1].percentile-b[1].percentile);
  const col=q=>q<30?"var(--bad)":q<60?"var(--warn)":"var(--good)";
  return `<h3>You against the reference base</h3>
  <p class="note">Base: ${B.n_players} players, ${B.n_rows} player-match records from ${B.n_matches} demos (your matches, searched players and randomly collected players).${B.my_rank?` Your median competitive rank: ${SKILL[B.my_rank]||B.my_rank} (${B.n_same} players of your level, ${B.n_higher} higher-ranked in the base).`:""} The bar shows your percentile: further right, you do better than most players. The line marks the median.</p>
  <div class="card bench">${rows.map(([k,m])=>`<div class="row"><span class="lb">${esc(m.label[0].toUpperCase()+m.label.slice(1))}</span>
    <div class="pbar" title="Better than ${Math.round(m.percentile)}% of players"><i style="width:${Math.max(2,m.percentile)}%;background:${col(m.percentile)}"></i><b></b></div>
    <span class="v">you ${fmtU(m.you,m.unit)} · med. ${fmtU(m.median,m.unit)}${m.higher_rank_median!=null?` · higher ranks ${fmtU(m.higher_rank_median,m.unit)}`:""}</span></div>`).join("")}</div>`}
const cls=(v,good,bad,higher=true)=>v==null?"":(higher?(v>=good?"good":v<=bad?"bad":""):(v<=good?"good":v>=bad?"bad":""));
// green / red against the base, match by match: in its best quarter / its worst quarter (fixed thresholds made
// nearly every match red on grenades, where the whole base is). Fixed thresholds only without base data.
function qcls(v,k,fb){if(v==null)return "";const m=(((P().advice||{}).bench||{}).metrics||{})[k];
  if(!m||m.p25==null||m.p75==null)return fb;return m.higher_better?(v>=m.p75?"good":v<=m.p25?"bad":""):(v<=m.p25?"good":v>=m.p75?"bad":"")}
function trendRows(ms,selIdx){return ms.map((m,i)=>{const s=m.sum,nr=typeof m.rounds==="number"?m.rounds:(m.per_round||[]).length,
  n24=s.nades_unused!=null&&nr?s.nades_unused*24/nr:null;return `<tr class="click" data-i="${i}" tabindex="0" aria-selected="${i===selIdx}">
  <td>${fmtDate(m.time)}</td><td>${MAPN(m.map)}</td><td>${esc(m.mode)}</td><td><span class="res ${m.result}">${m.score.me}-${m.score.them}</span></td>
  <td class="n">${s.kills}-${s.deaths}-${s.assists}</td><td class="n ${qcls(s.adr,"adr",cls(s.adr,85,65))}">${f1(s.adr)}</td><td class="n ${qcls(s.hs,"hs_pct",cls(s.hs,55,35))}">${f1(s.hs)}</td>
  <td class="n ${cls(s.kast,72,62)}">${f1(s.kast)}</td><td class="n ${qcls(s.traded_pct,"traded_pct",cls(s.traded_pct,25,10))}">${s.traded_pct==null?"—":f1(s.traded_pct)+"%"}</td>
  <td class="n ${qcls(n24,"nades_unused_24",cls(s.nades_unused,4,10,false))}">${s.nades_unused}</td><td class="n ${qcls(s.first_bullet,"b1_hit",cls(s.first_bullet,30,20))}">${s.first_bullet==null?"—":f1(s.first_bullet)+"%"}</td>
  <td class="n ${qcls(s.pistol_moving,"pistol_moving",cls(s.pistol_moving,25,45,false))}">${s.pistol_moving==null?"—":f1(s.pistol_moving)+"%"}</td>
  <td class="n ${qcls(s.xhair,"xhair",cls(s.xhair,4,8,false))}">${s.xhair==null?"—":f1(s.xhair)+"°"}</td><td class="n">${s.open_won}-${s.open_lost}</td></tr>`}).join("")}
const TREND_HEAD=`<thead><tr><th>Date</th><th>Map</th><th>Mode</th><th>Score</th><th class="n">K-D-A</th><th class="n">ADR</th><th class="n">HS %</th><th class="n">KAST</th><th class="n">Deaths<br>traded</th><th class="n">Grenades<br>wasted</th><th class="n">1st bullet<br>hits</th><th class="n">Pistol<br>moving</th><th class="n">Crosshair<br>offset</th><th class="n">Openings<br>W-L</th></tr></thead>`;
const WCOL={"rifles":"var(--t)","AWP":"var(--ct)","SMG":"var(--good)","shotguns":"var(--molotov)","pistols":"var(--muted)","fusils à pompe":"var(--molotov)","pistolets":"var(--muted)"};

        <div class="wleg">${Object.entries(A.weapons.shares).filter(([k,v])=>v>0).map(([k,v])=>`<span><b style="background:${WCOL[k]||"var(--muted)"}"></b>${esc(k)} ${v}%</span>`).join("")}</div></div>

    </div></div>
    ${A.peers.length?`<div class="tbl"><table><thead><tr><th>Role indicator</th><th class="n">You</th><th class="n">${esc(A.name)}s in the base</th><th class="n">The best of them</th></tr></thead><tbody>
      ${A.peers.map(x=>`<tr><td class="wrap">${esc(x.label)}</td><td class="n">${esc(x.you)}</td><td class="n">${esc(x.peers)}</td><td class="n">${esc(x.best)}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">${A.n_peers} players of the base have this archetype. "The best": the quarter with the most kills per round.</p>`:""}

    <div class="srcs"><span class="note">Sources:</span>${A.sources.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("")}</div>
  </article>`}
function proCard(x,metric,label){return `<div class="pro"><div class="top"><b>${esc(x.name)}</b><span class="sim">${x[metric]}%</span></div>
  <span class="note">${esc(x.team||"")}${x.role_name?` · ${esc(x.role_name)}`:""}</span>

  <span>${x.steamid?`<a href="#pros" data-openpro="${esc(x.steamid)}">Pro sheet</a> · `:""}${x.hltv?`<a href="${esc(x.hltv)}" target="_blank" rel="noopener">HLTV</a>`:""}</span></div>`}
document.addEventListener("click",e=>{const a=e.target.closest("[data-openpro]");if(a){e.preventDefault();openPro(a.dataset.openpro)}});
function prosBlock(p){const X=p.advice.pros;if(!X||!X.similar||!X.similar.length)return "";
  return `<article class="card"><h3>Pros who play like you</h3>
   <p class="note">${X.n_pros} pro players analyzed on ${X.n_maps} maps of recent matches (HLTV demos). Similarity = average closeness over 15 style indicators. Watch their demos or POVs to see your role played at the highest level.</p>
   <div class="pros">${X.similar.map(x=>proCard(x,"similarity")).join("")}</div>
   ${X.same_role.length?`<h3 style="margin-top:8px">Pros with the same archetype (${esc(X.role_name)})</h3><div class="pros">${X.same_role.map(x=>proCard(x,"similarity")).join("")}</div>`:""}</article>`}
function deepCard(p){const X=p.deep;if(!X)return "";const r=X.reaction,a=X.preaim,su=X.surprised;
  const fmtS=v=>v==null?"—":Math.round(v*1000)+" ms";
  return `<article class="card"><h3>Deep analysis</h3>
   <p class="note">From the visibility recorded in the demos (who sees whom, at every moment), over ${X.engagements} opened duels and ${X.deaths} deaths. Compared with the ${X.n_ref_players} other players of your matches.</p>
   <div class="gauge">
    <div><b>${fmtS(r.you)}</b><span>reaction time: from the enemy appearing to your first damage</span><span>others' median ${fmtS(r.median_others)} · faster than ${r.better_than_pct??"—"}% · ${r.share_under_350ms}% of your duels under 350 ms</span></div>
    <div><b>${a.you}°</b><span>crosshair offset when the enemy appears</span><span>others' median ${a.median_others}° · better than ${a.better_than_pct??"—"}%</span></div>
    <div><b>${su.you??"—"}%</b><span>of your deaths where the killer saw you first</span><span>others' median ${su.median_others}% · better than ${su.better_than_pct??"—"}% of players</span></div>
   </div>

    ${X.zones_vs_pros.map(z=>`<tr><td>${MAPN(z.map)}</td><td>${z.side}</td><td>${esc(z.zone)}</td><td class="n">${z.my_duels}</td><td class="n ${z.my_win-z.pro_win>=8?"good":z.my_win-z.pro_win<=-10?"bad":""}">${z.my_win}%</td><td class="n">${z.pro_win}% <span class="note">(${z.pro_duels})</span></td><td class="n">${z.my_hold}% / ${z.pro_hold}%</td></tr>`).join("")}
    </tbody></table></div><p class="note">Duels won in the zone, per side. Pros come from the analyzed HLTV demos.</p>`:""}
   <p class="note">The 2D replay of every round is in the Matches tab. Pro grenades to add to your game are in the Maps tab.</p></article>`}
function midCard(p){const M=(p.advice.plan||{}).mid;if(!M||(!M.weak.length&&!M.strong.length))return "";
  return `<article class="card"><h3>Mid-round at a glance</h3><ul>${M.weak.slice(0,3).map(w=>`<li>${esc(w.text)}${w.fix?` <b>${esc(w.fix)}</b>`:""}</li>`).join("")}${M.strong.slice(0,2).map(s=>`<li class="good">${esc(s.text)}</li>`).join("")}</ul>
   <p><a href="#midround" style="color:var(--ct)">Rotation routes, positions by weapon and reflexes: Mid-round tab</a></p></article>`}
// a teammate's whole history (their matches without you too): their Steam history code, given by them
async function fillFollow(p){const box=$("#follow-card");if(!box)return;let st;
  try{st=await (await fetch(`/api/steam/status?sid=${p.steamid}`)).json()}catch(e){box.querySelector(".note").textContent="The local server doesn't answer.";return}
  const inp="font:14px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:5px 8px";
  box.innerHTML=`<h3>Follow ${esc(p.name)}'s matches ${st.has_auth?'<span class="pill" style="color:var(--good)">on</span>':""}</h3>
   <p>Only the matches already on this PC are analyzed for ${esc(p.name)}: the ones you played together. To find <b>every match ${esc(p.name)} plays, even without you</b>, they can give you two codes from <a href="${esc((st.links||{}).auth||"https://help.steampowered.com/en/wizard/HelpWithGameIssue/?appid=730&issueid=128")}" target="_blank" rel="noopener" style="color:var(--ct)">Steam's CS2 help page</a> (signed in to <b>their own</b> account): their authentication code, and the code of one of their matches. For a single match, they can also send you its share code (CSGO-…): paste it in the search bar.</p>
   ${st.has_key?"":`<p class="note">First add your own Steam API key in <a href="#settings" style="color:var(--ct)">Settings</a>: it is used to read everyone's history.</p>`}
   <div class="row"><input id="fo-auth" type="password" autocomplete="off" spellcheck="false" placeholder="${st.has_auth?"already saved":"Their authentication code XXXX-XXXXX-XXXX"}" style="width:270px;${inp}">
     <input id="fo-known" type="text" autocomplete="off" spellcheck="false" placeholder="Code of one of their matches CSGO-…" style="flex:1;min-width:240px;${inp}"></div>
   <div class="row"><button type="button" class="primary" id="fo-save" ${st.has_key?"":"disabled"}>Save and check</button>
     <button type="button" class="primary" id="fo-sync" ${st.has_auth?"":"disabled"}>Find their new matches</button>
     ${st.has_auth?`<button type="button" class="close" id="fo-forget">Stop following</button>`:""}<span class="note" id="fo-msg" role="status"></span></div>
   ${st.has_auth?`<p class="note">Checked automatically when the app starts, then every 30 minutes. Last check: ${st.last_sync?fmtDate(st.last_sync):"never"}${st.pending?` · ${st.pending} match(es) waiting (Steam must be open and CS2 closed)`:""}.</p>`:""}
   <p class="note">Their codes stay in <code>out/settings.json</code> on this PC (not versioned) and only go to Steam's official API. Ask them first: these codes let you read their match history.</p>`;
  const msg=$("#fo-msg",box),sid=p.steamid;
  $("#fo-save",box).onclick=async()=>{const b=$("#fo-save",box);b.disabled=true;msg.textContent="Checking with Steam…";
    try{const j=await api("/api/steam/credentials",{sid,auth_code:$("#fo-auth",box).value.trim(),known_code:$("#fo-known",box).value.trim()});
      msg.textContent=j.saved.length?`Saved: ${j.saved.join(" and ")}.`:"Nothing new to save.";setTimeout(()=>fillFollow(p),900)}
    catch(e){msg.textContent=e.message;b.disabled=false}};
  $("#fo-sync",box).onclick=async()=>{msg.textContent="";try{await api("/api/steam/sync",{sid});poll()}catch(e){msg.textContent=e.message}};
  const fg=$("#fo-forget",box);if(fg)fg.onclick=async()=>{if(fg.dataset.ok!=="1"){fg.dataset.ok="1";fg.textContent="Confirm: remove their codes";return}
    try{await api("/api/steam/forget",{sid});fillFollow(p)}catch(e){msg.textContent=e.message}}}
// parts of the plan that failed at the last analysis: said, instead of silently missing
function missNote(p){const a=p.advice||{},u=[...new Set(((a.plan||{}).unavailable)||[])];
  if(a.plan_error)return `<p class="miss" role="status">The coaching plan could not be updated at the last analysis (${esc(a.plan_error)}): what you see is the previous one. It is rebuilt at the next analysis.</p>`;
  return u.length?`<p class="miss" role="status">Not computed at the last analysis: ${u.map(esc).join(", ")}. These parts come back at the next analysis.</p>`:""}
function renderAnalysis(){
  const p=P(),v=$("#v-analysis"),ms=p.matches;const rec={win:0,draw:0,loss:0};ms.forEach(m=>rec[m.result]++);
  const auto=p.advice.rules.map((r,i)=>({level:i<2?"high":"mid",title:r.title,evidence:r.why,fix:r.do,standing:r.standing,target:r.target,bench:r.bench,drills:r.drills,sources:r.sources}));
  v.innerHTML=`<div class="head"><div style="display:grid;gap:4px"><span class="eyebrow">${esc(p.name)} · ${ms.length} matches analyzed</span><h2>Full analysis</h2></div>
    <div class="record"><span>${rec.win}<small>wins</small></span><span>${rec.draw}<small>draws</small></span><span>${rec.loss}<small>losses</small></span></div></div>
    ${missNote(p)}
    ${p.advice.strengths.length?`<div class="strengths">${p.advice.strengths.map(s=>`<span>${esc(s)}</span>`).join("")}</div>`:""}
    ${D.local&&p.steamid!==D.own?`<article class="card form" id="follow-card"><h3>Follow ${esc(p.name)}'s matches</h3><p class="note">Loading…</p></article>`:""}
    ${archCard(p)}
    ${midCard(p)}
    ${deepCard(p)}
    ${prosBlock(p)}
    ${p.overall?`<h3>What the coach detects · ${ms.length} matches</h3>`:""}
    ${findings(auto)}
    ${p.overall?`<details class="old-notes"><summary style="cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:600">Earlier hand-written analysis${p.overall.scope?` · ${esc(p.overall.scope)}`:""}</summary>
      <p class="note" style="margin:8px 0">Written from those matches only: its numbers are from that time. The list above covers all your matches and is the one to follow.</p>
      <p style="max-width:75ch">${p.overall.summary}</p>${findings(p.overall.priorities)}</details>`:""}
    ${benchSection(p)}
    ${extrasBlock(p)}
    ${ms.length?`<h3>Match by match</h3><div class="tbl"><table>${TREND_HEAD}<tbody>${trendRows(ms,-1)}</tbody></table></div>`:""}
    ${leetBlock(p)}`;
  $$("tr.click",v).forEach(r=>{r.onclick=()=>{S.match=+r.dataset.i;go("matches")};r.onkeydown=e=>{if(e.key==="Enter")r.click()}});
  copyBtn(v);
  fillFollow(p);
}

 mine:["Green dot = your position when you kill. Red cross = your position when you die, dashed from your killer. Number = round.",'<span><i style="background:var(--good)"></i>kill</span><span><i style="background:var(--bad)"></i>death</span>'],
 heatT:["Your presence as T.",'<span><i style="background:var(--t)"></i>presence</span>'],heatCT:["Your presence as CT.",'<span><i style="background:var(--ct)"></i>presence</span>'],
 open:["First kill of each round, all players.",'<span><i style="background:var(--t)"></i>T opening</span><span><i style="background:var(--ct)"></i>CT opening</span>']};
// round by round from the demo: where the Ts went and how fast, who died where and when
function storyBlock(m){const side={};m.per_round.forEach(r=>side[r.round]=r.side);
  const rows=m.story.filter(s=>side[s.r]),ct=rows.filter(s=>side[s.r]==="CT"),tt=rows.filter(s=>side[s.r]==="T");

    $$("[data-level]",box).forEach(b=>b.onclick=()=>{st.level=b.dataset.level;press(box,"[data-level]",b);redraw()});
    panel();redraw();
  }
}

// ---------- view: progress ----------
const WORKS=v=>v==="it works"||v==="ça marche",HURTS=v=>v==="it hurts"||v==="ça dégrade";
function expValue(x,unit){if(!x||x.value==null)return "—";return x.kind==="prop"?`${x.value}% (${x.k}/${x.n})`:fmtU(x.value,unit)}
function expCard(e){const pr=e.progress||[0,1,""],pct=Math.min(100,Math.round(100*pr[0]/Math.max(pr[1],1)));
  const cls=WORKS(e.verdict)?"strong":HURTS(e.verdict)?"weak":"";
  return `<article class="card exp"><div class="top"><span class="tag">${esc(e.category)}</span><span class="pill ${cls}">${e.status==="active"?"":"finished · "}${esc(e.verdict)}</span></div>
   <span class="ttl">${esc(e.title)}</span>
   <ul>${(e.how||[]).map(h=>`<li>${esc(h)}</li>`).join("")}</ul>
   <div class="prog" title="${pct}%"><i style="width:${pct}%"></i></div><span class="note">${pr[0]}/${pr[1]} ${esc(pr[2])} · started ${fmtDate(e.started)}${e.ended?` · finished ${fmtDate(e.ended)}`:""}</span>
   <div class="standing"><span>${esc(e.metric)}</span><span>before: ${expValue(e.before,e.unit)} · since: ${expValue(e.after,e.unit)}</span></div>
   ${e.status==="active"&&D.local?`<div class="btns"><button type="button" data-xstop="${e.id}">End the experiment</button></div>`:""}</article>`}
function suggestCard(s,i){return `<article class="card exp"><div class="top"><span class="tag">${esc(s.category)}</span></div><span class="ttl">${esc(s.title)}</span><p>${esc(s.why)}</p><span class="note">Measured with: ${esc(s.metric)}</span>${D.local?`<div class="btns"><button type="button" class="primary" data-xstart="${i}">Start</button></div>`:""}</article>`}
function kpiCard(k){const vals=k.series.map(x=>x[1]),W=200,H=40,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((y,i)=>`${(i/Math.max(vals.length-1,1)*W).toFixed(1)},${(H-4-(y-mn)/rg*(H-8)).toFixed(1)}`).join(" ");
  const d=k.recent-k.before,better=k.higher_better?d>0:d<0;
  return `<div class="kpi"><span class="note">${esc(k.label)}</span><b class="${Math.abs(d)<1e-9?"":better?"good":"bad"}">${fmtU(k.recent,k.unit)}</b>
   <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Trend over ${vals.length} matches"><polyline points="${pts}" fill="none" stroke="var(--ct)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
   <span class="note">last 3 ${fmtU(k.recent,k.unit)} · before ${fmtU(k.before,k.unit)} · ${vals.length} matches</span></div>`}
function weaponsBlock(W){const RD=W.ref_duels||{};
  return `<h3>Your weapons</h3>${W.suggestions.length?`<ul class="pl-list">${W.suggestions.map(s=>`<li class="${s.kind==="weapon_weak"?"avoid":/strong/.test(s.kind)?"exploit":"coach"}">${esc(s.text)}</li>`).join("")}</ul>`:""}
   <div class="tbl"><table><thead><tr><th>Main weapon of the round</th><th class="n">Rounds</th><th class="n">Kills / round</th><th class="n">Damage / round</th><th class="n">Survival</th><th class="n">Rounds won</th><th class="n">Duels won: you · base</th></tr></thead><tbody>
   ${W.by_weapon.map(x=>{const d=W.duels[x.key],r=RD[x.key];return `<tr><td>${esc(x.key)}</td><td class="n">${x.rounds}</td><td class="n">${f1(x.kpr)}</td><td class="n">${x.adr}</td><td class="n">${x.survival}%</td><td class="n">${x.win}%</td>
     <td class="n ${d&&r!=null&&d.n>=10?(d.win>=r+8?"good":d.win<=r-8?"bad":""):""}">${d?`${d.win}% <span class="note">(${d.n})</span>`:"—"} · ${r!=null?r+"%":"—"}</td></tr>`}).join("")}
   </tbody></table></div>
   ${W.force&&W.force.length?`<p class="note"><b>On force-buys:</b> ${W.force.filter(x=>x.rounds>=2).map(x=>`${esc(x.key)} ${x.adr} damage/round (${x.rounds} rounds)`).join(" · ")}</p>`:""}
   <p class="note">Over ${W.n_rounds} analyzed rounds. Duels: kills and deaths with the weapon in hand, compared with every player of the base.</p>`}
function buysBlock(B){if(!B||!B.types)return "";const T=B.types;
  return `<h3>Your buys by type of round</h3>

   ${["pistol","eco","force","full","anti-eco"].filter(k=>T[k]).map(k=>{const x=T[k],b=x.kits[0];return `<tr><td><b>${esc(x.label)}</b></td><td class="n">${x.rounds}</td><td class="n">${x.win??"—"}% · ${x.peer_win??"—"}%</td>

     <td class="wrap">${x.kits.slice(1).map(y=>esc(y.key)).join("<br>")||"—"}</td></tr>`}).join("")}</tbody></table></div>`}

    <div class="tech">${T.week.map(w=>`<div><b>${esc(w.title)}</b>${esc(w.text)}</div>`).join("")}</div>`:""}
   ${X?`<h3>Experiments</h3><p class="note">You start a test and play normally: the coach compares your next matches with your previous 15 and gives a verdict once there is enough data (difference significant at 90%).${D.local?"":" Starting or ending an experiment happens in the local app."}</p>

    ${old.length?`<details><summary style="cursor:pointer">Finished experiments (${old.length})</summary><div class="exps" style="margin-top:10px">${old.map(expCard).join("")}</div></details>`:""}

  igEv={key,contact:mk.contact||null,alone:mk.alone??null,site:g.round_phase==="live"&&(s==="A"||s==="B")?s:null}}return igEv}
const DYN_EN={rush:"rush",fast:"fast push by 1-2 Ts",exec:"execute",late:"late hit",none:"no attack"},DYN_SHORT={rush:"rush",fast:"fast",exec:"exec",late:"late",none:""};

  if(R.plant!=null){c=R.plant-7;how=`bomb down at ${clock(R.plant)}`}else if(mk.site_t!=null){c=mk.site_t;how=`seen on the site at ${clock(mk.site_t)}`}
  if(c==null)return site==="-"?{dyn:"none",how:"marked not clear",lone:!!mk.lone}:mk.lone?{dyn:null,how:"",lone:true}:null;

// where you usually stand on a map as CT: your time per zone (profile), summed by A side / B side / mid (spawns left out)

  for(const z of zs){if(/spawn/i.test(z.name||"")||!z.presence)continue;const r=(SE.regions||{})[z.name]||"mid";W[r]=(W[r]||0)+z.presence;t+=z.presence}

function tsidePredict(TS,map,g,ev){const M=TS&&TS.maps&&TS.maps[map];if(!M||!g||g.round==null)return null;
  const H=g.hist||{},R=H.rounds||{},SI=H.sites||{},cur=g.round_phase==="over"?g.round+1:g.round;
  if(g.round_phase==="over"&&halfStart(cur)===cur)return null;   // the sides swap: this team will not attack any more
  const half=[];for(let n=halfStart(cur);n<cur;n++)half.push(n);

  else{const last=R[half[half.length-1]]||{};let losses=0;for(let i=half.length-1;i>=0;i--){if((R[half[i]]||{}).win==="CT")losses++;else break}

    mix=econ?{eco:econ.eco/100,force:econ.force/100,full:econ.full/100}:{full:.6,force:.35,eco:.05}}

  if(w){pA/=w;none/=w;rush/=w}else{pA=M.pA_hit;none=M.all.none/100;rush=rOf(M.all)}

// ---------- live radar: where to stand and what to throw (strong spots, multi-kill spots, grenades for now, rotation
// after the plant). The odds (sites, entrances, rush) live in the side panel only: the radar never repeats them ----------
const playSite=p=>p==="none"?"none":p.startsWith("rush")||p.startsWith("split")?p.slice(-1):p[0];
const isRushPlay=p=>p.startsWith("rush");
// odds of every play this round: the base's plays for this kind of round, the team's rushes, what you see in the
// round (clock, first contact), then scaled to the site reading (which also knows this team's habits)
function tsidePlays(TS,map,g,ev,r){const M=TS&&TS.maps&&TS.maps[map],P=M&&M.plays;if(!P||!r)return null;
  let pr={},w=0;
  for(const [c,k] of Object.entries(r.mix||{})){const x=P.prior[c]||P.prior.all;if(!x||!k)continue;for(const [p,v] of Object.entries(x))pr[p]=(pr[p]||0)+k*v;w+=k}
  if(!w)pr=Object.assign({},P.prior.all);
  let R0=0;for(const p in pr)if(isRushPlay(p))R0+=pr[p];
  const RP=r.rush/100;if(R0>0.005&&R0<0.995){const k1=RP/R0,k0=(1-RP)/(1-R0);for(const p in pr)pr[p]*=isRushPlay(p)?k1:k0}
  const t=g&&g.elapsed!=null?g.elapsed:0,ev0=ev||{};
  if(r.live&&!r.planted&&t>=5&&P.surv&&P.surv.t){const i=Math.min(P.surv.t.length-1,Math.round(t/5));for(const p in pr){const s=P.surv[p];if(s)pr[p]*=s[i]}}
  if(r.live&&!r.planted&&ev0.contact&&P.contact)for(const p in pr){const L=P.contact[p];if(L)pr[p]*=(L[ev0.contact]??L.other??1)}
  const tot={A:0,B:0,none:0},want={A:r.A/100,B:r.B/100,none:r.none/100};for(const p in pr)tot[playSite(p)]+=pr[p];
  for(const p in pr){const s=playSite(p);pr[p]=tot[s]>1e-9?pr[p]*want[s]/tot[s]:0}
  const sum=Object.values(pr).reduce((a,b)=>a+b,0)||1;for(const p in pr)pr[p]/=sum;
  // each entrance: chance it is used this round, chance it gets pushed in the next 15 s, the rushes through it
  const lanes=[];
  ["A","B"].forEach(s=>((P.lanes||{})[s]||[]).forEach((L,i)=>{let use=0,haz=0,rush=0;
    for(const p in pr){if(playSite(p)!==s)continue;const u=(P.use[p]||{})[i]||0;if(!u||!pr[p])continue;use+=pr[p]*u;if(isRushPlay(p))rush+=pr[p]*u;
      const sv=P.surv[p];if(sv){const i0=Math.min(sv.length-1,Math.floor(t/5)),i1=Math.min(sv.length-1,i0+3);if(sv[i0]>0.002)haz+=pr[p]*u*Math.max(0,(sv[i0]-sv[i1])/sv[i0])}}
    lanes.push(Object.assign({},L,{site:s,i,key:s+i,p:use,haz,rush}))}));
  const list=Object.entries(pr).map(([p,v])=>({p,v,label:P.label[p]||p,site:playSite(p)})).sort((a,b)=>b.v-a.v);
  return {list,lanes,rush:list.filter(x=>isRushPlay(x.p)).reduce((a,x)=>a+x.v,0),pr}}

// grenades worth throwing now, at the entrances (time-aware): anti-rush only while a rush is still possible,
// blocking when the base says the Ts usually push that entrance in the next seconds
function nadesNow(PL,map,g,PLs,live){const E=((((PL.nades||{}).maps||{})[map])||{}).CT,LP=E&&E.lanes;if(!LP||!PLs)return [];
  const t=live&&g&&g.elapsed!=null?g.elapsed:0,held=live&&g&&g.nades?g.nades:null,out=[];
  PLs.lanes.forEach(L=>{const picks=LP[L.key]||{};
    Object.entries(picks).forEach(([type,x])=>{if(held&&!(held[type]>0))return;
      let why=null,score=0;
      const nm=L.name.split(" / ")[0];
      if(x.role==="anti_rush"){if(t<=32&&L.rush>=0.05){why=`anti-rush on ${nm}: ${Math.round(100*L.rush)}% they rush through here`;score=L.rush*1.2}}
      else if(x.role==="block"){if(L.haz>=0.1||(!live&&L.p>=0.3&&type==="smoke")){why=live?`block ${nm}: ${Math.round(100*L.haz)}% they push it in the next 15 s`:`block ${nm} (${Math.round(100*L.p)}% of attacks use it)`;score=live?L.haz:L.p*0.5}}
      else if(x.role==="flash"){if(L.haz>=0.12){why=`flash ${nm} as they push: blinds an enemy ${x.blind}% of the time`;score=L.haz*0.7}}
      else if(L.haz>=0.12){why=`HE on ${nm} as they push`;score=L.haz*0.6}
      if(why)out.push(Object.assign({},x,{type,why,score,lane:L.key,laneName:L.name}))})});
  out.sort((a,b)=>b.score-a.score);
  const seen=new Set();return out.filter(x=>{const k=x.type+x.lane;if(seen.has(k))return false;seen.add(k);return true}).slice(0,4)}

// your live position on the radar (world units -> radar pixels), and the zone you are in
function worldPx(GEO,pos){const R=GEO&&GEO.radar;if(!R||!pos)return null;
  const px=[(pos[0]-R.pos_x)/R.scale*(R.f||1),(R.pos_y-pos[1])/R.scale*(R.f||1)];
  let lv=(R.levels[0]||{}).key;for(const L of R.levels){if(L.z_min!=null&&pos[2]<L.z_min)continue;if(L.z_max!=null&&pos[2]>=L.z_max)continue;lv=L.key;break}
  return {px,level:lv}}
function nearestZone(GEO,px,level){let best=null,bd=1e9;Object.entries((GEO&&GEO.zones)||{}).forEach(([n,z])=>{if(level&&z.level&&z.level!==level)return;const d=Math.hypot(z.px[0]-px[0],z.px[1]-px[1]);if(d<bd){bd=d;best=n}});return best}
// rotation to the bomb site from where you are (or your usual spot): the ways players of the base take
function rotationFor(M,site,from,GEO){const R=((M.rotations||{})[site])||{};if(!Object.keys(R).length||!from)return null;
  let k=R[from]?from:null;
  if(!k&&GEO&&GEO.zones&&GEO.zones[from]){const f=GEO.zones[from].px;k=Object.keys(R).filter(z=>GEO.zones[z]).sort((a,b)=>Math.hypot(GEO.zones[a].px[0]-f[0],GEO.zones[a].px[1]-f[1])-Math.hypot(GEO.zones[b].px[0]-f[0],GEO.zones[b].px[1]-f[1]))[0]}
  return k?{from:k,...R[k]}:null}

// ---------- radar drawing: one visual language per layer ----------
// strong spots: green shields · multi-kills: gold stars (yours), white stars (other players, on your spots) · your spots: thin rings ·
// grenades: dotted arcs ending on the grenade's own icon · rotation: route with a dark casing and chevrons ·
// plant: C4 tag · you: pulsing white dot
const PLACED=new WeakMap();   // labels already on a radar: a new one that would cover one moves down
function place(ov,x,y,w,h){let L=PLACED.get(ov);if(!L){L=[];PLACED.set(ov,L)}
  for(let k=0;k<6&&L.some(b=>Math.abs(b.x-x)<(b.w+w)/2+2&&Math.abs(b.y-y)<(b.h+h)/2);k++)y+=h+2;L.push({x,y,w,h});return y}
// pill: entrances and sites (rounded, filled with the site's color)
function rbadge(ov,x,y,text,fill,cls){const w=7.2*text.length+14;y=place(ov,x,y,w,22);const gg=el("g",{class:"rb"+(cls?" "+cls:"")},ov);
  el("rect",{x:x-w/2,y:y-11,width:w,height:22,rx:11,style:`fill:${fill};stroke:#0b0f14;stroke-width:1.5`},gg);
  el("text",{x,y:y+4.5,"text-anchor":"middle",class:"rbt"},gg).textContent=text;return gg}
// tag: grenades and rotations (square, dark, a color bar on the left)
function rtag(ov,x,y,text,color,cls){const w=6.6*text.length+18;y=place(ov,x,y,w,20);const gg=el("g",{class:"rt "+(cls||"")},ov);
  el("rect",{x:x-w/2,y:y-10,width:w,height:20,rx:3,style:"fill:#0b0f14;fill-opacity:.88;stroke:#ffffff33;stroke-width:1"},gg);
  el("rect",{x:x-w/2,y:y-10,width:4,height:20,rx:1.5,style:`fill:${color}`},gg);
  el("text",{x:x+2,y:y+4,"text-anchor":"middle",class:"rtt"},gg).textContent=text;return gg}
function starPath(x,y,R,r,n){let d="";for(let i=0;i<2*n;i++){const a=-Math.PI/2+i*Math.PI/n,q=i%2?r:R;d+=(i?"L":"M")+(x+q*Math.cos(a)).toFixed(1)+" "+(y+q*Math.sin(a)).toFixed(1)}return d+"Z"}
// gold star with the number of multi-kill rounds (your spots)
function mkStar(ov,x,y,s){const g=el("g",{class:"mkstar"},ov);
  el("path",{d:starPath(x,y,11,4.6,5),style:"fill:#ffd24a;stroke:#5a4100;stroke-width:1.4"},g);
  el("text",{x:x+14,y:y+4.5,class:"mkt"},g).textContent=`×${s.multi2}${s.best>=3?` · ${s.best}K`:""}`;
  return tip(g,`${s.name}: ${s.multi2} round${s.multi2>1?"s":""} with 2+ kills from here (best: ${s.best} kills)`)}
// the grenade's own icon where it lands
function nadeIcon(ov,type,x,y,title){const g=el("g",{class:"nicon"},ov);
  if(type==="smoke"){el("circle",{cx:x,cy:y,r:17,style:"fill:#c9d1d9;fill-opacity:.5;stroke:#eef2f6;stroke-width:2;stroke-dasharray:4 3"},g);
    [[-6,-2,7],[5,-4,8],[0,5,7]].forEach(([dx,dy,r])=>el("circle",{cx:x+dx,cy:y+dy,r,style:"fill:#e9eef3;fill-opacity:.85"},g))}
  else if(type==="molotov")el("path",{d:`M${x} ${y-15}C${x+11} ${y-3} ${x+9} ${y+10} ${x} ${y+10}C${x-9} ${y+10} ${x-11} ${y-3} ${x-3} ${y-8}C${x-2} ${y-2} ${x+2} ${y-3} ${x} ${y-15}Z`,style:"fill:#ff7a1a;stroke:#4a1600;stroke-width:1.6"},g);
  else if(type==="flash")el("path",{d:starPath(x,y,15,6,8),style:"fill:#fff3a0;stroke:#7a6a00;stroke-width:1.4"},g);
  else{el("circle",{cx:x,cy:y,r:12,style:"fill:#6abf69;stroke:#0b0f14;stroke-width:1.6"},g);el("text",{x,y:y+4,"text-anchor":"middle",class:"het"},g).textContent="HE"}
  return tip(g,title)}
// dotted arc from where you throw to where it lands
function nadeArc(ov,x1,y1,x2,y2,type){const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1,cx=(x1+x2)/2-dy/d*d*0.18,cy=(y1+y2)/2+dx/d*d*0.18;
  el("path",{d:`M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`,style:`fill:none;stroke:var(--${type});stroke-width:2.6;stroke-dasharray:1.5 5;stroke-linecap:round`},ov);
  el("circle",{cx:x1,cy:y1,r:4.5,style:`fill:#fff;stroke:var(--${type});stroke-width:2.2`},ov)}
// a wedge from an entrance toward its site: wide where the Ts come from, pointed at the site
function laneWedge(gl,x1,y1,x2,y2,w,col){const d=Math.hypot(x2-x1,y2-y1)||1,ux=(x2-x1)/d,uy=(y2-y1)/d,ex=x2-ux*36,ey=y2-uy*36,h=w/2;
  el("path",{d:`M${x1-uy*h} ${y1+ux*h}L${ex-uy*3} ${ey+ux*3}L${ex+ux*12} ${ey+uy*12}L${ex+uy*3} ${ey-ux*3}L${x1+uy*h} ${y1-ux*h}Z`,style:`fill:${col};fill-opacity:.32;stroke:${col};stroke-width:1.6;stroke-opacity:.9`},gl)}
// a route: dark casing, colored core, chevrons showing the way
function routeLine(ov,pts,col,main){const s=pts.map(p=>p.join(",")).join(" ");

// predictability: the plays shown as path 1 this half (kept in this browser), the ones that lost go down, a play
// shown again and again goes down a little: the other side reads you too
function planMemory(g,rows){if(!g||!g.map||g.round==null||!rows||!rows.length)return {rows,rotated:false};
  const hs=halfStart(g.round),key=`pp|${g.map}|${g.side}|${hs}`;let mem={};try{mem=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
  if(g.round===hs&&Object.keys(mem).some(n=>+n>hs))mem={};   // a new match on this map
  const R=((g.hist||{}).rounds)||{},used={},lost={};
  for(const [n,k] of Object.entries(mem)){if(+n>=g.round)continue;used[k]=(used[k]||0)+1;const w=(R[n]||{}).win;if(w&&w!==g.side)lost[k]=(lost[k]||0)+1}
  const top0=rows[0].k,adj=r=>-.05*(lost[r.k]||0)-.02*Math.max(0,(used[r.k]||0)-1);
  const out=rows.slice().sort((a,b)=>(b.s+adj(b))-(a.s+adj(a)));
  if(!mem[g.round]&&(g.round_phase==="freezetime"||g.round_phase==="live")){mem[g.round]=out[0].k;try{localStorage.setItem(key,JSON.stringify(mem))}catch(e){}}
  return {rows:out,rotated:out[0].k!==top0,lost:lost[top0]||0}}
